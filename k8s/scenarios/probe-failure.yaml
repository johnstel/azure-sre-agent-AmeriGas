# =============================================================================
# SCENARIO 6: Failed Liveness Probe - Safety Compliance Monitor Misconfigured
# Domain: Shared (safety compliance applies to both domains)
# =============================================================================
# Safety compliance monitoring probe misconfigured after maintenance window,
# causing Kubernetes to continuously restart the pod.
#
# SRE Agent can diagnose: Pod being killed due to failed liveness probe,
# recommend checking application health endpoint or probe configuration.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/probe-failure.yaml
#
# HOW TO FIX:
# kubectl delete deployment safety-compliance-monitor -n propane
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safety-compliance-monitor
  namespace: propane
  labels:
    app: safety-compliance-monitor
    scenario: probe-failure
    sre-demo: breakable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safety-compliance-monitor
  template:
    metadata:
      labels:
        app: safety-compliance-monitor
        scenario: probe-failure
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: safety-compliance-app
          image: mcr.microsoft.com/mirror/docker/library/nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          # BREAKING CHANGE: Liveness probe to endpoint that doesn't exist
          livenessProbe:
            httpGet:
              path: /health/nonexistent
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/nonexistent
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
