# =============================================================================
# SCENARIO 6: Bulk Tank Safety Alarm - Healthy Workload, Delayed Processing
# Domain: Bulk Tank
# =============================================================================
# This scenario replaces the former dummy nginx probe failure with a
# deterministic, simulated abnormal tank level reading. The workload remains
# healthy while the alarm-processing component delays or suppresses the pending
# safety alarm. Azure SRE Agent can correlate the healthy pod state with the
# delayed alarm queue and the exact-once processing recovery path.
#
# The thresholds and severity labels below are SIMULATED only and require
# ZavaGas safety SME validation before they are treated as production policy.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/probe-failure.yaml
#
# HOW TO FIX:
# kubectl delete deployment safety-compliance-monitor -n propane --ignore-not-found
# kubectl delete configmap tank-safety-alarm-config -n propane --ignore-not-found
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tank-safety-alarm-config
  namespace: propane
  labels:
    app: safety-compliance-monitor
    scenario: probe-failure
    sre-demo: breakable
    domain: bulk-tank
data:
  alarm_id: "BT-SAFETY-ALM-00042"
  asset_id: "BT-1551"
  alarm_type: "rapid_level_drop"
  reading_age_minutes: "9"
  simulated_severity: "SEV-1"
  ack_state: "pending"
  processed_exactly_once: "false"
  threshold: "SIMULATED tank level drop below 20% after 15 minutes; requires ZavaGas safety SME validation."
  triggered_at: "2025-02-11T06:41:52Z"
  detected_at: "2025-02-11T06:51:12Z"
  processing_component: "safety-compliance-monitor"
  processing_state: "suppressed"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safety-compliance-monitor
  namespace: propane
  labels:
    app: safety-compliance-monitor
    scenario: probe-failure
    sre-demo: breakable
    domain: bulk-tank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safety-compliance-monitor
  template:
    metadata:
      labels:
        app: safety-compliance-monitor
        scenario: probe-failure
        domain: bulk-tank
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: safety-compliance-app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo '{"event":"bulk_tank_safety_alarm","alarm_id":"BT-SAFETY-ALM-00042","asset_id":"BT-1551","reading_age_minutes":9,"simulated_severity":"SEV-1","ack_state":"pending","triggered_at":"2025-02-11T06:41:52Z","detected_at":"2025-02-11T06:51:12Z","threshold":"SIMULATED tank level drop below 20% after 15 minutes; requires ZavaGas safety SME validation.","processing_component":"safety-compliance-monitor","processing_state":"suppressed","workload_healthy":true,"duplicate_incident_count":0}'
              while true; do
                echo '{"event":"alarm_processing","alarm_id":"BT-SAFETY-ALM-00042","status":"delayed","component":"safety-compliance-monitor","processing_state":"suppressed","workload_healthy":true,"duplicate_incident_count":0}'
                sleep 30
              done
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            exec:
              command: ["sh", "-c", "echo ok && exit 0"]
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo ready && exit 0"]
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
