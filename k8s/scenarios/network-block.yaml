# =============================================================================
# SCENARIO 7: Network Policy Blocking - Tank Monitor Isolated
# =============================================================================
# A security policy update isolates tank-monitor, blocking all ingress and
# egress traffic.
#
# SRE Agent can diagnose: Network connectivity issues, service unavailable,
# recommend checking network policies and firewall rules.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/network-block.yaml
#
# HOW TO FIX:
# kubectl delete networkpolicy deny-tank-monitor -n propane
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tank-monitor
  namespace: propane
  labels:
    scenario: network-block
    sre-demo: breakable
spec:
  podSelector:
    matchLabels:
      app: tank-monitor
  policyTypes:
    - Ingress
    - Egress
  # BREAKING CHANGE: No ingress or egress rules = all traffic denied
  ingress: []
  egress: []
