# =============================================================================
# SCENARIO 2: CrashLoopBackOff - Inventory Service Startup Failure
# Domain: Shared (Bulk Tank pricing & Cylinder Exchange cage catalog)
# =============================================================================
# The inventory-service crashes on startup due to invalid pricing configuration,
# entering a CrashLoopBackOff state.
#
# SRE Agent can diagnose: Pod is in CrashLoopBackOff, container exit code,
# recommend checking application logs and configuration.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/crash-loop.yaml
#
# HOW TO FIX:
# kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: propane
  labels:
    app: inventory-service
    scenario: crash-loop
    sre-demo: breakable
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: inventory-service
          image: ghcr.io/azure-samples/aks-store-demo/product-service:latest
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            # BREAKING CHANGE: Invalid forecast service URL causes startup failure
            - name: AI_SERVICE_URL
              value: "http://nonexistent-forecast:9999/"
          # BREAKING CHANGE: Command that causes immediate exit
          command: ["/bin/sh"]
          args: ["-c", "echo 'Starting with invalid pricing config...'; exit 1"]
