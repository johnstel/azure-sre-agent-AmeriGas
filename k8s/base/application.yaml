# =============================================================================
# AmeriGas Propane Distribution Platform - Base Application Deployment
# =============================================================================
# This is the healthy baseline deployment of the AmeriGas Propane Distribution
# Platform for demonstrating Azure SRE Agent diagnosis capabilities.
#
# Domain Model — this platform supports TWO distinct propane business
# domains. See docs/sre-agent-knowledge.md "Domain Model" for full detail.
#   - Bulk Tank: residential/commercial bulk propane tanks & deliveries.
#     Vocabulary: gallons, tank percentage, consumption, refill
#     recommendation, delivery scheduling.
#   - Cylinder Exchange: retail cylinder exchange cages at partner stores.
#     Vocabulary: full/empty/reserved cylinder counts, cage replenishment,
#     exchange-location terminology.
# Each resource below is annotated with its Domain in a comment header.
#
# Architecture:
# - customer-portal: Vue.js customer self-service portal (Bulk Tank account
#   view + Cylinder Exchange nearby-location browsing)
# - dispatch-console: Vue.js Retail Cage Operations Center (Cylinder Exchange)
# - tank-monitor: Node.js IoT tank level monitoring API (Bulk Tank)
# - inventory-service: Rust-based propane inventory & pricing API (Shared)
# - order-service: Go order fulfillment & processing (Shared)
# - demand-service: Python propane demand forecasting (optional, Shared)
# - usage-simulator: Customer propane usage pattern generator (Bulk Tank)
# - order-worker: Order processing worker (Shared)
#
# Data Services (in-cluster):
# - rabbitmq: Event bus (tank alerts, order events, fulfillment updates) (Shared)
# - mongodb: Tank readings, delivery records, customer data (Shared)
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: propane
  labels:
    app.kubernetes.io/part-of: amerigas-propane-demo
    sre-agent-demo: "true"

---
# =============================================================================
# Telemetry Configuration - App Insights + OpenTelemetry
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: propane-telemetry-config
  namespace: propane
  labels:
    app.kubernetes.io/part-of: amerigas-propane-demo
data:
  APPLICATIONINSIGHTS_CONNECTION_STRING: "PLACEHOLDER_INJECT_AT_DEPLOY"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.propane.svc.cluster.local:4318"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.5"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=demo,service.namespace=propane"

---
# =============================================================================
# RabbitMQ - Event bus (tank alerts, order events, fulfillment updates)
# Domain: Shared — carries Bulk Tank alerts (tank-events) and delivery/order
# events used by both the Bulk Tank and Cylinder Exchange domains.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: propane
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: rabbitmq
          image: rabbitmq:3.11-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: propane
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

---
# =============================================================================
# MongoDB - Tank readings, delivery records, customer data (Azure Managed Disk via CSI driver)
# Domain: Shared — persists Bulk Tank readings (tank_readings collection) plus
# delivery/order and customer account records used across both domains.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data-pvc
  namespace: propane
  labels:
    app: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi # Uses Azure Managed Disk CSI driver (default in AKS)
  resources:
    requests:
      storage: 8Gi

---
# =============================================================================
# MongoDB - Tank & Delivery Database
# Domain: Shared (see above)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: propane
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: mongodb
          image: mongo:4.4
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: propane
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

---
# =============================================================================
# Inventory Service - Rust-based propane inventory & pricing API
# Domain: Shared — serves the Bulk Tank product catalog (delivery pricing per
# gallon) and the Cylinder Exchange cage catalog (cage capacity, cylinder
# pricing tiers) from a single pricing/catalog API.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: propane
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: inventory-service
          image: ghcr.io/azure-samples/aks-store-demo/product-service:latest
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: AI_SERVICE_URL
              value: "http://demand-service:5001/"
            - name: OTEL_SERVICE_NAME
              value: "inventory-service"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: propane
spec:
  selector:
    app: inventory-service
  ports:
    - port: 3002
      targetPort: 3002

---
# =============================================================================
# Tank Monitor - Node.js IoT tank level monitoring API
# Domain: Bulk Tank — ingests smart sensor telemetry from residential and
# commercial bulk propane tanks only (gallons, tank percentage, leak
# detection). Not used for retail cylinder exchange cage inventory, which is
# tracked separately via exchange/inventory transaction counts.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tank-monitor
  namespace: propane
  labels:
    app: tank-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tank-monitor
  template:
    metadata:
      labels:
        app: tank-monitor
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: tank-monitor
          image: ghcr.io/azure-samples/aks-store-demo/order-service:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: ORDER_QUEUE_HOSTNAME
              value: "rabbitmq"
            - name: ORDER_QUEUE_PORT
              value: "5672"
            - name: ORDER_QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: ORDER_QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: ORDER_QUEUE_NAME
              value: "tank-events"
            - name: FASTIFY_ADDRESS
              value: "0.0.0.0"
            - name: OTEL_SERVICE_NAME
              value: "tank-monitor"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: tank-monitor
  namespace: propane
spec:
  selector:
    app: tank-monitor
  ports:
    - port: 3000
      targetPort: 3000

---
# =============================================================================
# Order Service - Go order fulfillment & processing
# Domain: Shared — processes both Bulk Tank delivery/refill orders and
# Cylinder Exchange cage restock orders.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: propane
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: order-service
          image: ghcr.io/azure-samples/aks-store-demo/makeline-service:latest
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: ORDER_QUEUE_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: uri
            - name: ORDER_QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: ORDER_QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: ORDER_QUEUE_NAME
              value: "tank-events"
            - name: ORDER_DB_URI
              value: "mongodb://mongodb:27017"
            - name: ORDER_DB_NAME
              value: "propanedb"
            - name: ORDER_DB_COLLECTION_NAME
              value: "tank_readings"
            - name: OTEL_SERVICE_NAME
              value: "order-service"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: propane
spec:
  selector:
    app: order-service
  ports:
    - port: 3001
      targetPort: 3001

---
# =============================================================================
# Customer Portal - Customer self-service portal (nginx serving custom HTML)
# Domain: Shared UI — hosts two distinct domain sections in one portal:
#   1. Bulk Tank (residential/commercial delivery account: gallons, tank
#      percentage, consumption, refill recommendation, delivery scheduling)
#   2. Cylinder Exchange (retail cage locations: full/empty/reserved
#      cylinder counts, cage replenishment, exchange-location terminology)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-portal-html
  namespace: propane
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmeriGas — My Account</title>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --accent: #003DA5; --orange: #FF6900; --green: #34d399; --amber: #fbbf24; --red: #f87171; --text: #e2e8f0; --muted: #94a3b8; --border: #334155; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      header { background: linear-gradient(135deg, #001d52 0%, #003DA5 100%); border-bottom: 3px solid var(--orange); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
      header h1 { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; }
      .status-bar { display: flex; gap: 1.5rem; font-size: .85rem; align-items: center; }
      .status-bar .item { display: flex; align-items: center; gap: .4rem; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
      .dot.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
      .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
      main { padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
      .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
      .card { background: var(--card); border-radius: 10px; padding: 1.2rem; border: 1px solid var(--border); }
      .card h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .6rem; }
      .metric { font-size: 2rem; font-weight: 700; }
      .metric sub { font-size: .7rem; font-weight: 400; color: var(--muted); }
      .section-title { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 .8rem; color: var(--orange); border-bottom: 1px solid var(--border); padding-bottom: .4rem; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: .55rem .8rem; text-align: left; border-bottom: 1px solid var(--border); font-size: .85rem; }
      th { color: var(--muted); text-transform: uppercase; font-size: .72rem; letter-spacing: .06em; }
      .badge { padding: .15rem .55rem; border-radius: 4px; font-size: .72rem; font-weight: 600; white-space: nowrap; }
      .badge.in-stock { background: #064e3b; color: var(--green); }
      .badge.low-stock { background: #78350f; color: var(--amber); }
      .badge.out-of-stock { background: #7f1d1d; color: var(--red); }
      .badge.online { background: #064e3b; color: var(--green); }
      .badge.offline { background: #7f1d1d; color: var(--red); }
      .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
      /* Gauge */
      .gauge-wrap { display: flex; align-items: center; gap: 1rem; }
      .gauge { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
      .gauge-inner { width: 58px; height: 58px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; }
      .gauge-label { font-size: .8rem; color: var(--muted); }
      /* Cylinder Exchange cage viz */
      .cage { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
      .cylinder-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
      .cylinder-dot.full { background: var(--accent); box-shadow: 0 0 3px rgba(0,61,165,.5); }
      .cylinder-dot.empty { background: var(--border); }
      .cylinder-dot.reserved { background: var(--orange); box-shadow: 0 0 3px rgba(255,105,0,.4); }
      .cage-counts { font-size: .75rem; color: var(--muted); margin-top: 3px; }
      .domain-tag { font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: -.5rem 0 .8rem; }
      .loc-row:hover { background: rgba(51,65,85,.4); }
      .footer { text-align: center; padding: 2rem; color: var(--muted); font-size: .75rem; border-top: 1px solid var(--border); margin-top: 2rem; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
      .loading { animation: pulse 1.5s infinite; color: var(--muted); }
      .demand-peak { color: var(--red); font-weight: 700; }
      .demand-normal { color: var(--amber); font-weight: 700; }
      .demand-low { color: var(--green); font-weight: 700; }
    </style>
    </head>
    <body>
    <header>
      <h1>&#128293; AmeriGas Propane &mdash; My Account</h1>
      <div class="status-bar">
        <div class="item"><span class="dot green"></span> Account Active</div>
        <div class="item" id="clock"></div>
      </div>
    </header>
    <main>
      <div id="portal-banner" style="display:none;margin:0 0 1rem;padding:.8rem 1rem;border-radius:10px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.12);color:var(--green);font-size:.85rem;line-height:1.4;"></div>
      <!-- Domain: Bulk Tank -->
      <h2 class="section-title">&#128738; My Bulk Tank</h2>
      <div class="domain-tag">Bulk Tank Account &mdash; gallons &amp; tank percentage</div>
      <!-- Top Metrics -->
      <div class="metrics-grid">
        <div class="card">
          <h3>My Tank Level</h3>
          <div class="gauge-wrap">
            <div class="gauge" id="tank-gauge"><div class="gauge-inner" id="tank-pct">--%</div></div>
            <div class="gauge-label" id="tank-status">Calculating&hellip;</div>
          </div>
        </div>
        <div class="card">
          <h3>Est. Days Until Empty</h3>
          <div class="metric" id="days-empty" style="color:var(--amber)">--<sub> days</sub></div>
        </div>
        <div class="card">
          <h3>Next Delivery</h3>
          <div id="next-delivery" style="font-size:1.1rem;font-weight:600;color:var(--green)">--</div>
          <div id="delivery-window" style="font-size:.8rem;color:var(--muted);margin-top:.3rem"></div>
        </div>
        <div class="card">
          <h3>Current Price</h3>
          <div class="metric" id="current-price" style="color:var(--text)">--<sub> /gal</sub></div>
        </div>
        <div class="card">
          <h3>Season Demand</h3>
          <div id="season-demand" style="font-size:1.4rem;font-weight:700">--</div>
        </div>
        <div class="card">
          <h3>Account Balance</h3>
          <div class="metric" id="acct-balance" style="color:var(--green)">--</div>
        </div>
      </div>

      <!-- Usage History -->
      <h2 class="section-title">&#128202; My Bulk Tank Usage History</h2>
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead><tr><th>Date</th><th>Gallons Used</th><th>Tank Level</th><th>Daily Avg</th></tr></thead>
          <tbody id="usage-body"></tbody>
        </table>
      </div>

      <!-- Domain: Cylinder Exchange -->
      <h2 class="section-title">&#127978; Nearby Exchange Locations</h2>
      <div class="domain-tag">Cylinder Exchange &mdash; full / empty / reserved cylinder counts</div>
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>Location</th><th>Region</th><th>Cage Inventory</th><th>Cylinder Counts</th><th>Status</th><th>Distance</th></tr>
          </thead>
          <tbody id="locations-body">
            <tr><td colspan="6" class="loading">Loading exchange locations&hellip;</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Service Health -->
      <h2 class="section-title">&#128295; Service Health</h2>
      <div class="health-grid" id="health-cards"></div>
    </main>
    <div class="footer">AmeriGas &mdash; Propane Distribution Platform &mdash; Azure SRE Agent Demo Lab</div>

    <script>
    /* ---- helpers (Domain: Shared) ---- */
    function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
    function randF(a,b){return+(Math.random()*(b-a)+a).toFixed(2);}
    function fmt(n){return n.toLocaleString();}
    var PortalHealthState = (typeof window !== 'undefined' && window.PortalHealthState) || (function () {
      function normalizeServiceState(service) {
        if (!service) return { ok: true, code: 'unknown', degraded: false, name: 'Service' };
        if (typeof service.ok === 'boolean') {
          return { ok: service.ok, code: service.code || service.status || (service.ok ? 200 : 500), degraded: !service.ok, name: service.name || 'Service' };
        }
        var numericStatus = Number(service.status || service.code || 0);
        var ok = service.status === undefined && service.code === undefined ? true : numericStatus >= 200 && numericStatus < 500;
        return { ok: ok, code: numericStatus || 'unknown', degraded: !ok, name: service.name || 'Service' };
      }
      function isStale(updatedAt, staleAfterMs) {
        if (!updatedAt) return false;
        var timestamp = new Date(updatedAt).getTime();
        if (Number.isNaN(timestamp)) return false;
        return Date.now() - timestamp > (staleAfterMs || 30000);
      }
      function derivePortalState(serviceResults, portalName, staleAfterMs) {
        var serviceResultsSafe = serviceResults || {};
        var results = {
          inventory: normalizeServiceState(serviceResultsSafe.inventory),
          tank: normalizeServiceState(serviceResultsSafe.tank),
          orders: normalizeServiceState(serviceResultsSafe.orders),
          mongodb: serviceResultsSafe.mongodb ? normalizeServiceState(serviceResultsSafe.mongodb) : { ok: true, code: 200, degraded: false, name: 'MongoDB' },
          rabbitmq: serviceResultsSafe.rabbitmq ? normalizeServiceState(serviceResultsSafe.rabbitmq) : { ok: true, code: 200, degraded: false, name: 'RabbitMQ' }
        };
        var derivedMongoOk = results.inventory.ok && results.orders.ok && !results.mongodb.degraded;
        var derivedRabbitOk = results.tank.ok && results.orders.ok && !results.rabbitmq.degraded;
        results.mongodb = Object.assign({}, results.mongodb, { ok: derivedMongoOk, degraded: !derivedMongoOk, code: derivedMongoOk ? 200 : 503 });
        results.rabbitmq = Object.assign({}, results.rabbitmq, { ok: derivedRabbitOk, degraded: !derivedRabbitOk, code: derivedRabbitOk ? 200 : 503 });
        var relevantKeys = portalName === 'customer' ? ['inventory', 'tank', 'mongodb', 'rabbitmq'] : ['orders', 'mongodb', 'rabbitmq', 'tank'];
        var lastUpdated = serviceResults && serviceResults.updatedAt ? serviceResults.updatedAt : new Date().toISOString();
        var stale = isStale(lastUpdated, staleAfterMs);
        var degraded = relevantKeys.some(function (key) { return results[key].degraded; }) || stale;
        var status = degraded ? 'degraded' : 'healthy';
        var state = { status: status, degraded: degraded, stale: stale, lastUpdated: lastUpdated, message: degraded ? 'Customer-facing data is temporarily delayed while the propane platform reconnects.' : 'Live operational data is current.', services: results };
        if (portalName === 'dispatch') {
          state.message = degraded ? 'Operations data is temporarily delayed while the dispatch pipeline recovers.' : 'Live dispatch telemetry is current.';
        }
        return state;
      }
      return { normalizeServiceState: normalizeServiceState, isStale: isStale, derivePortalState: derivePortalState };
    }());
    if (typeof window !== 'undefined') { window.PortalHealthState = PortalHealthState; }
    var LAST_KNOWN_METRICS=null;
    var LAST_KNOWN_LOCATIONS=null;
    var LAST_KNOWN_USAGE=null;
    var PORTAL_STATE={healthy:true,message:'Live operational data is current.',lastUpdated:new Date().toISOString()};
    function setPortalBanner(status,message,timestamp){
      var banner=document.getElementById('portal-banner');
      if(!banner){return;}
      banner.style.display='block';
      banner.style.background=status==='healthy'?'rgba(34,197,94,0.12)':'rgba(245,158,11,0.14)';
      banner.style.border=status==='healthy'?'1px solid rgba(34,197,94,0.3)':'1px solid rgba(245,158,11,0.35)';
      banner.style.color=status==='healthy'?'var(--green)':'var(--amber)';
      banner.innerHTML='<strong>' + (status==='healthy'?'All systems normal':'Customer visibility is temporarily degraded') + '.</strong> ' + message + (timestamp ? ' Last updated ' + new Date(timestamp).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) + '.' : '');
    }
    /* ---- top metrics (Domain: Bulk Tank) ---- */
    function makeMetricSnapshot(){
      var pct=rand(30,85);
      var gaugeColor=pct>50?'var(--green)':pct>25?'var(--amber)':'var(--red)';
      var statusText=pct>50?'Good — no action needed':pct>25?'Monitor — consider ordering':'Low — delivery recommended';
      var days=rand(5,45);
      var daysOut=rand(1,14);
      var dd=new Date();dd.setDate(dd.getDate()+daysOut);
      var opts={weekday:'short',month:'short',day:'numeric'};
      var hrs=rand(7,14);
      var price=randF(2.15,2.89);
      var mo=new Date().getMonth();
      var season,cls;
      if(mo>=10||mo<=2){season='Peak';cls='demand-peak';}
      else if(mo>=3&&mo<=4||mo>=8&&mo<=9){season='Normal';cls='demand-normal';}
      else{season='Low';cls='demand-low';}
      var bal=rand(0,250);
      return {
        pct:pct,
        gaugeColor:gaugeColor,
        statusText:statusText,
        days:days,
        nextDelivery:dd.toLocaleDateString('en-US',opts),
        deliveryWindow:hrs+':00 — '+(hrs+3)+':00 window',
        price:price,
        season:season,
        cls:cls,
        balance:bal,
        balanceText:bal>0?'$'+fmt(bal)+' credit':'$0.00',
        balanceColor:bal>0?'var(--green)':'var(--muted)'
      };
    }

    /* ---- clock (Domain: Shared) ---- */
    function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}

    /* ---- top metrics (Domain: Bulk Tank) ---- */
    function updateMetrics(){
      var snapshot=PORTAL_STATE.healthy ? makeMetricSnapshot() : (LAST_KNOWN_METRICS || makeMetricSnapshot());
      LAST_KNOWN_METRICS=snapshot;
      PORTAL_STATE.lastUpdated=new Date().toISOString();
      var pct=snapshot.pct;
      var gaugeColor=snapshot.gaugeColor;
      var g=document.getElementById('tank-gauge');
      g.style.background='conic-gradient('+gaugeColor+' 0% '+pct+'%, var(--border) '+pct+'% 100%)';
      document.getElementById('tank-pct').textContent=pct+'%';
      document.getElementById('tank-status').textContent=snapshot.statusText;

      var de=document.getElementById('days-empty');
      de.innerHTML=snapshot.days+'<sub> days</sub>';
      de.style.color=snapshot.days>14?'var(--green)':snapshot.days>7?'var(--amber)':'var(--red)';

      document.getElementById('next-delivery').textContent=snapshot.nextDelivery;
      document.getElementById('delivery-window').textContent=snapshot.deliveryWindow;

      document.getElementById('current-price').innerHTML='$'+snapshot.price.toFixed(2)+'<sub> /gal</sub>';

      var sd=document.getElementById('season-demand');
      sd.textContent=snapshot.season;sd.className=snapshot.cls;

      var be=document.getElementById('acct-balance');
      be.textContent=snapshot.balanceText;
      be.style.color=snapshot.balanceColor;
    }

    /* ---- exchange locations (Domain: Cylinder Exchange) ---- */
    var LOCATIONS=[
      {name:'Home Depot King of Prussia',region:'PA-East',cageSize:20,dist:'2.3 mi'},
      {name:'Walmart Collegeville',region:'PA-East',cageSize:20,dist:'4.1 mi'},
      {name:"Lowe's Exton",region:'PA-East',cageSize:12,dist:'6.8 mi'},
      {name:'ACE Hardware Lansdale',region:'PA-East',cageSize:12,dist:'8.2 mi'},
      {name:'Wawa Wayne',region:'PA-East',cageSize:12,dist:'3.5 mi'},
      {name:'ShopRite Norristown',region:'PA-Central',cageSize:20,dist:'5.6 mi'},
      {name:'Giant Pottstown',region:'PA-Central',cageSize:20,dist:'12.4 mi'},
      {name:'Costco Plymouth Meeting',region:'NJ-North',cageSize:24,dist:'7.9 mi'}
    ];

    function computeLocationRows(){
      return LOCATIONS.map(function(loc){
        var full=rand(0,loc.cageSize);
        var reserved=full>0?rand(0,Math.min(3,full)):0;
        full=full-reserved;
        var empty=loc.cageSize-full-reserved;
        var statusClass,statusLabel;
        if(full===0){statusClass='out-of-stock';statusLabel='Out of Stock';}
        else if(full<=3){statusClass='low-stock';statusLabel='Low Stock';}
        else{statusClass='in-stock';statusLabel='In Stock';}
        return {
          name:loc.name,
          region:loc.region,
          dist:loc.dist,
          cageSize:loc.cageSize,
          dots:{ full:full, empty:empty, reserved:reserved },
          statusClass:statusClass,
          statusLabel:statusLabel
        };
      });
    }

    function loadLocations(){
      var rows=PORTAL_STATE.healthy ? computeLocationRows() : (LAST_KNOWN_LOCATIONS || computeLocationRows());
      LAST_KNOWN_LOCATIONS=rows;
      var tbody=document.getElementById('locations-body');
      tbody.innerHTML='';
      rows.forEach(function(loc){
        var dots='';
        for(var i=0;i<loc.dots.full;i++) dots+='<span class="cylinder-dot full"></span>';
        for(var i=0;i<loc.dots.empty;i++) dots+='<span class="cylinder-dot empty"></span>';
        for(var i=0;i<loc.dots.reserved;i++) dots+='<span class="cylinder-dot reserved"></span>';
        var tr=document.createElement('tr');
        tr.className='loc-row';
        tr.innerHTML='<td style="font-weight:600">'+loc.name+'</td>'+
          '<td>'+loc.region+'</td>'+
          '<td><div class="cage">'+dots+'</div></td>'+
          '<td><div class="cage-counts">'+loc.dots.full+' Full / '+loc.dots.empty+' Empty / '+loc.dots.reserved+' Reserved (cylinders)</div></td>'+
          '<td><span class="badge '+loc.statusClass+'">'+loc.statusLabel+'</span></td>'+
          '<td>'+loc.dist+'</td>';
        tbody.appendChild(tr);
      });
    }

    /* ---- usage history (Domain: Bulk Tank) ---- */
    function computeUsageRows(){
      var level=rand(55,85);
      var rows=[];
      for(var i=0;i<8;i++){
        var d=new Date();d.setDate(d.getDate()-i*7);
        var used=randF(8,32);
        var avg=randF(1.2,4.5);
        rows.push({
          date:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
          used:used.toFixed(1)+' gal',
          level:level+'%',
          avg:avg.toFixed(1)+' gal/day'
        });
        level=Math.max(10,level-rand(4,10));
      }
      return rows;
    }

    function loadUsage(){
      var rows=PORTAL_STATE.healthy ? computeUsageRows() : (LAST_KNOWN_USAGE || computeUsageRows());
      LAST_KNOWN_USAGE=rows;
      var tbody=document.getElementById('usage-body');
      tbody.innerHTML='';
      rows.forEach(function(row){
        var tr=document.createElement('tr');
        tr.innerHTML='<td>'+row.date+'</td>'+
          '<td>'+row.used+'</td>'+
          '<td>'+row.level+'</td>'+
          '<td>'+row.avg+'</td>';
        tbody.appendChild(tr);
      });
    }

    /* ---- service health (Domain: Shared) ---- */
    var SERVICES=[
      {name:'Inventory Service',url:'/api/inventory/health'},
      {name:'Tank Monitor',url:'/api/tanks/health'},
      {name:'Order Service',url:'/api/orders/health'},
      {name:'MongoDB',url:null},
      {name:'RabbitMQ',url:null}
    ];

    function fetchHealth(url){
      return fetch(url,{signal:AbortSignal.timeout(3000)})
        .then(function(response){
          if(!response.ok){
            return Promise.reject(new Error('HTTP '+response.status));
          }
          return {ok:true,status:response.status};
        })
        .catch(function(err){
          return {ok:false,status:err && err.message ? err.message : 'unreachable'};
        });
    }

    function applyOperationalState(details){
      PORTAL_STATE=Object.assign({}, PORTAL_STATE, details);
      if(details.healthy){
        setPortalBanner('healthy', details.message || 'Live operational data is current.', details.lastUpdated);
      }else{
        setPortalBanner('degraded', details.message || 'Customer-facing data may be temporarily delayed while the propane platform reconnects.', details.lastUpdated);
      }
    }

    function loadHealth(){
      var c=document.getElementById('health-cards');
      c.innerHTML='';
      Promise.all([
        fetchHealth('/api/inventory/health'),
        fetchHealth('/api/tanks/health'),
        fetchHealth('/api/orders/health')
      ]).then(function(results){
        var inventory=results[0];
        var tank=results[1];
        var orders=results[2];
        var state = PortalHealthState.derivePortalState({
          inventory: inventory,
          tank: tank,
          orders: orders,
          updatedAt: new Date().toISOString()
        }, 'customer', 30000);
        var healthy = !state.degraded;
        var detail = state.message;
        applyOperationalState({ healthy: healthy, message: detail, lastUpdated: state.lastUpdated });
        var serviceRows=[
          {name:'Inventory Service',ok:inventory.ok,status:'Healthy',detail:inventory.ok ? 'Inventory service responding normally.' : 'HTTP ' + inventory.status},
          {name:'Tank Monitor',ok:tank.ok,status:'Healthy',detail:tank.ok ? 'Tank telemetry stream is online.' : 'HTTP ' + tank.status},
          {name:'Order Service',ok:orders.ok,status:'Healthy',detail:orders.ok ? 'Order flow is matching demand.' : 'HTTP ' + orders.status},
          {name:'MongoDB',ok:!state.services.mongodb.degraded,status:'Healthy',detail:state.services.mongodb.degraded ? 'Dependency issue detected; data refresh is delayed.' : 'MongoDB dependency is healthy.'},
          {name:'RabbitMQ',ok:!state.services.rabbitmq.degraded,status:'Healthy',detail:state.services.rabbitmq.degraded ? 'Dependency issue detected; event flow is degraded.' : 'RabbitMQ dependency is healthy.'}
        ];
        serviceRows.forEach(function(svc){
          var card=document.createElement('div');
          card.className='card';
          var color=svc.ok?'var(--green)':'var(--amber)';
          var icon=svc.ok?'green':'amber';
          if(!svc.ok && (svc.name==='MongoDB' || svc.name==='RabbitMQ')){
            color='var(--red)';
            icon='red';
          }
          card.innerHTML='<h3>'+svc.name+'</h3><div style="font-size:1.1rem;font-weight:600;color:'+color+'"><span class="dot '+icon+'"></span> '+(svc.ok?'Healthy':'Degraded')+'</div>' +
            '<div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">'+svc.detail+'</div>';
          c.appendChild(card);
        });
      }).catch(function(){
        applyOperationalState({ healthy: false, message: 'Customer-safe status: some operational data is temporarily delayed while the propane platform reconnects.', lastUpdated: new Date().toISOString() });
        var serviceRows=[
          {name:'Inventory Service',ok:false,status:'Degraded',detail:'Service check failed'},
          {name:'Tank Monitor',ok:false,status:'Degraded',detail:'Service check failed'},
          {name:'Order Service',ok:false,status:'Degraded',detail:'Service check failed'},
          {name:'MongoDB',ok:false,status:'Degraded',detail:'Dependency status uncertain; data view is stale'},
          {name:'RabbitMQ',ok:false,status:'Degraded',detail:'Dependency status uncertain; event queue is disrupted'}
        ];
        serviceRows.forEach(function(svc){
          var card=document.createElement('div');card.className='card';
          card.innerHTML='<h3>'+svc.name+'</h3><div style="font-size:1.1rem;font-weight:600;color:var(--red)"><span class="dot red"></span> Degraded</div><div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">'+svc.detail+'</div>';
          c.appendChild(card);
        });
      });
    }

    /* ---- init (Domain: Shared) ---- */
    updateClock();
    setPortalBanner('healthy','Live operational data is current.', new Date().toISOString());
    updateMetrics();
    loadLocations();
    loadUsage();
    loadHealth();
    setInterval(updateClock,1000);
    setInterval(updateMetrics,5000);
    setInterval(loadLocations,10000);
    setInterval(loadUsage,30000);
    setInterval(loadHealth,30000);
    </script>
    </body>
    </html>


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-portal-nginx
  namespace: propane
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;

        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
        location = /api/inventory/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://inventory-service.propane.svc.cluster.local:3002/health;
        }
        location = /api/tanks/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tank-monitor.propane.svc.cluster.local:3000/health;
        }
        location = /api/orders/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://order-service.propane.svc.cluster.local:3001/health;
        }
        location /api/ {
            return 404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: propane
  labels:
    app: customer-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-portal
  template:
    metadata:
      labels:
        app: customer-portal
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: customer-portal
          image: nginx:alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: customer-portal-html
        - name: nginx-conf
          configMap:
            name: customer-portal-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: propane
spec:
  type: LoadBalancer
  selector:
    app: customer-portal
  ports:
    - port: 80
      targetPort: 8080

---
# =============================================================================
# Dispatch Console - Retail Cage Operations Center (nginx serving custom HTML)
# Domain: Cylinder Exchange — cage grid, cylinder counts, delivery/restock
# queue, and demand forecast for retail cylinder exchange cage locations.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-console-html
  namespace: propane
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmeriGas Retail Cage Operations Center</title>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --accent: #a78bfa; --green: #34d399; --amber: #fbbf24; --red: #f87171; --cyan: #22d3ee; --text: #e2e8f0; --muted: #94a3b8; --blue: #003DA5; --orange: #FF6900; --empty: #334155; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      header { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); border-bottom: 2px solid var(--accent); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
      header h1 { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; gap: .6rem; }
      .status-bar { display: flex; gap: 1.5rem; font-size: .85rem; }
      .status-bar .item { display: flex; align-items: center; gap: .4rem; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
      .dot.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
      .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
      main { padding: 1.5rem 2rem; }
      .metrics-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
      @media (max-width: 1200px) { .metrics-row { grid-template-columns: repeat(3, 1fr); } }
      @media (max-width: 700px) { .metrics-row { grid-template-columns: repeat(2, 1fr); } }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.2rem; margin-bottom: 1.5rem; }
      .cage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-bottom: 1.5rem; }
      @media (max-width: 1100px) { .cage-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 700px) { .cage-grid { grid-template-columns: 1fr; } }
      .card { background: var(--card); border-radius: 10px; padding: 1.2rem; border: 1px solid #334155; }
      .card h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .8rem; }
      .metric { font-size: 2rem; font-weight: 700; }
      .metric sub { font-size: .7rem; font-weight: 400; color: var(--muted); }
      .section-title { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 .8rem; color: var(--accent); border-bottom: 1px solid #334155; padding-bottom: .4rem; }
      .legend { display: flex; gap: 1.5rem; font-size: .8rem; color: var(--muted); margin-bottom: 1rem; }
      .legend span { display: flex; align-items: center; gap: .3rem; }
      .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
      .cylinder-grid { display: grid; grid-template-columns: repeat(5, 18px); grid-template-rows: repeat(4, 18px); gap: 4px; margin: .6rem 0; }
      .cylinder { width: 18px; height: 18px; border-radius: 50%; }
      .cylinder.full { background: var(--blue); box-shadow: 0 0 4px rgba(0,61,165,0.5); }
      .cylinder.empty { background: var(--empty); }
      .cylinder.transit { background: var(--orange); box-shadow: 0 0 4px rgba(255,105,0,0.4); }
      .cage-card { background: var(--card); border-radius: 10px; padding: 1rem; border: 1px solid #334155; }
      .cage-card .loc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem; }
      .cage-card .loc-name { font-weight: 600; font-size: .95rem; }
      .region-badge { padding: .1rem .45rem; border-radius: 4px; font-size: .65rem; font-weight: 600; background: #1e1b4b; color: var(--accent); }
      .cage-card .summary { font-size: .78rem; color: var(--muted); margin: .3rem 0; }
      .cage-card .detail-row { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-top: .3rem; }
      .status-badge { padding: .15rem .5rem; border-radius: 4px; font-size: .72rem; font-weight: 600; display: inline-block; margin-top: .3rem; }
      .status-badge.stocked { background: #064e3b; color: var(--green); }
      .status-badge.low { background: #78350f; color: var(--amber); }
      .status-badge.critical { background: #7f1d1d; color: var(--red); }
      .status-badge.restock { background: #1e1b4b; color: var(--accent); }
      @keyframes pulse-border { 0%,100% { border-color: var(--red); } 50% { border-color: transparent; } }
      .cage-card.critical-loc { border: 2px solid var(--red); animation: pulse-border 1.5s infinite; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: .6rem .8rem; text-align: left; border-bottom: 1px solid #334155; font-size: .85rem; }
      th { color: var(--muted); text-transform: uppercase; font-size: .75rem; letter-spacing: .06em; }
      .badge { padding: .15rem .5rem; border-radius: 4px; font-size: .75rem; font-weight: 600; }
      .badge.online { background: #064e3b; color: var(--green); }
      .badge.offline { background: #7f1d1d; color: var(--red); }
      .badge.warning { background: #78350f; color: var(--amber); }
      .badge.processing { background: #1e1b4b; color: var(--accent); }
      .footer { text-align: center; padding: 2rem; color: var(--muted); font-size: .75rem; }
      .log-box { background: #0d1117; border: 1px solid #334155; border-radius: 8px; padding: 1rem; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: .8rem; max-height: 220px; overflow-y: auto; line-height: 1.6; }
      .log-box .ts { color: var(--muted); }
      .log-box .info { color: var(--cyan); }
      .log-box .warn { color: var(--amber); }
      .log-box .err { color: var(--red); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
      .loading { animation: pulse 1.5s infinite; color: var(--muted); }
      .demand-high { color: var(--red); font-weight: 600; }
      .demand-normal { color: var(--green); }
      .demand-low { color: var(--cyan); }
    </style>
    </head>
    <body>
    <header>
      <h1>&#9881;&#65039; AmeriGas &mdash; Retail Cage Operations Center</h1>
      <div class="status-bar">
        <div class="item"><span class="dot green"></span> Dispatcher Mode</div>
        <div class="item">Cylinder Exchange Domain</div>
        <div class="item" id="clock"></div>
      </div>
    </header>
    <main>
      <!-- Domain: Cylinder Exchange -->
      <div id="dispatch-banner" style="display:none;margin:0 0 1rem;padding:.8rem 1rem;border-radius:10px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.12);color:var(--green);font-size:.85rem;line-height:1.4;"></div>
      <div class="metrics-row">
        <div class="card"><h3>Total Retail Locations</h3><div class="metric" style="color:var(--accent)" id="m-locations">--</div></div>
        <div class="card"><h3>Cylinders in Field</h3><div class="metric" style="color:var(--cyan)" id="m-cylinders">--</div></div>
        <div class="card"><h3>Avg Fill Rate</h3><div class="metric" style="color:var(--green)" id="m-fill">--<sub> %</sub></div></div>
        <div class="card"><h3>Critical Locations</h3><div class="metric" style="color:var(--red)" id="m-critical">--</div></div>
        <div class="card"><h3>Deliveries Today</h3><div class="metric" style="color:var(--amber)" id="m-deliveries">--</div></div>
        <div class="card"><h3>Tomorrow Forecast</h3><div class="metric" style="font-size:1.3rem" id="m-forecast">--</div></div>
      </div>

      <h2 class="section-title">&#127978; Retail Cage Inventory Monitor</h2>
      <div class="legend">
        <span><span class="legend-dot" style="background:var(--blue)"></span> Full</span>
        <span><span class="legend-dot" style="background:var(--empty)"></span> Empty</span>
        <span><span class="legend-dot" style="background:var(--orange)"></span> In-Transit</span>
      </div>
      <div class="cage-grid" id="cage-grid"></div>

      <h2 class="section-title">&#128197; Delivery Schedule &amp; Priority Queue</h2>
      <div class="card" style="overflow-x:auto">
        <table>
          <thead><tr><th>Location</th><th>Full / Total</th><th>Empty</th><th>Daily Turnover</th><th>Est. Stockout</th><th>Priority</th><th>Scheduled Delivery</th></tr></thead>
          <tbody id="delivery-body"></tbody>
        </table>
      </div>

      <h2 class="section-title">&#127777;&#65039; Demand Forecast</h2>
      <div class="card" style="overflow-x:auto">
        <table>
          <thead><tr><th>Day</th><th>High Temp (&deg;F)</th><th>Demand Level</th><th>Est. Cylinders Needed</th><th>Notes</th></tr></thead>
          <tbody id="forecast-body"></tbody>
        </table>
      </div>

      <h2 class="section-title">&#128223; Operations Log</h2>
      <div class="log-box" id="ops-log"></div>

      <h2 class="section-title">&#128295; Platform Health</h2>
      <div class="grid" id="health-grid"></div>
    </main>
    <div class="footer">AmeriGas &mdash; Retail Cage Operations Center &mdash; Azure SRE Agent Demo Lab</div>

    <script>
    // Domain: Cylinder Exchange
    const LOCATIONS = [
      { name: 'Home Depot KoP', region: 'PA-East' },
      { name: 'Walmart Collegeville', region: 'PA-East' },
      { name: "Lowe's Exton", region: 'PA-East' },
      { name: 'ACE Lansdale', region: 'PA-East' },
      { name: 'Wawa Wayne', region: 'PA-East' },
      { name: 'ShopRite Norristown', region: 'PA-East' },
      { name: 'Giant Pottstown', region: 'PA-Central' },
      { name: 'Costco Plymouth Meeting', region: 'PA-East' },
      { name: 'Home Depot Allentown', region: 'PA-Central' },
      { name: "BJ's Whitehall", region: 'PA-Central' },
      { name: 'Tractor Supply Quakertown', region: 'PA-Central' },
      { name: 'Walmart Easton', region: 'PA-Central' },
    ];

    const DELIVERY_TIMES = ['Tomorrow 6AM', 'Tomorrow 2PM', 'Thu 8AM', 'Thu 2PM', 'Fri 6AM', 'Fri 10AM', 'Sat 7AM', 'None Scheduled'];
    const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const FORECAST_NOTES = [
      'Cold snap expected', 'Steady demand', 'Weekend BBQ season boost',
      'Mild temperatures', 'Storm front approaching', 'Holiday weekend surge',
      'Below-average temps forecast', 'Seasonal transition period',
      'Post-storm recovery demand', 'Normal consumption pattern',
    ];

    let locationData = [];
    let LAST_KNOWN_LOCATION_DATA = [];
    let DISPATCH_STATE = { healthy: true, message: 'Live dispatch telemetry is current.', lastUpdated: new Date().toISOString() };
    // Domain: Shared
    const PortalHealthState = (typeof window !== 'undefined' && window.PortalHealthState) || (function () {
      function normalizeServiceState(service) {
        if (!service) return { ok: true, code: 'unknown', degraded: false, name: 'Service' };
        if (typeof service.ok === 'boolean') {
          return { ok: service.ok, code: service.code || service.status || (service.ok ? 200 : 500), degraded: !service.ok, name: service.name || 'Service' };
        }
        var numericStatus = Number(service.status || service.code || 0);
        var ok = service.status === undefined && service.code === undefined ? true : numericStatus >= 200 && numericStatus < 500;
        return { ok: ok, code: numericStatus || 'unknown', degraded: !ok, name: service.name || 'Service' };
      }
      function isStale(updatedAt, staleAfterMs) {
        if (!updatedAt) return false;
        var timestamp = new Date(updatedAt).getTime();
        if (Number.isNaN(timestamp)) return false;
        return Date.now() - timestamp > (staleAfterMs || 30000);
      }
      function derivePortalState(serviceResults, portalName, staleAfterMs) {
        var serviceResultsSafe = serviceResults || {};
        var results = {
          inventory: normalizeServiceState(serviceResultsSafe.inventory),
          tank: normalizeServiceState(serviceResultsSafe.tank),
          orders: normalizeServiceState(serviceResultsSafe.orders),
          mongodb: serviceResultsSafe.mongodb ? normalizeServiceState(serviceResultsSafe.mongodb) : { ok: true, code: 200, degraded: false, name: 'MongoDB' },
          rabbitmq: serviceResultsSafe.rabbitmq ? normalizeServiceState(serviceResultsSafe.rabbitmq) : { ok: true, code: 200, degraded: false, name: 'RabbitMQ' }
        };
        var derivedMongoOk = results.inventory.ok && results.orders.ok && !results.mongodb.degraded;
        var derivedRabbitOk = results.tank.ok && results.orders.ok && !results.rabbitmq.degraded;
        results.mongodb = Object.assign({}, results.mongodb, { ok: derivedMongoOk, degraded: !derivedMongoOk, code: derivedMongoOk ? 200 : 503 });
        results.rabbitmq = Object.assign({}, results.rabbitmq, { ok: derivedRabbitOk, degraded: !derivedRabbitOk, code: derivedRabbitOk ? 200 : 503 });
        var relevantKeys = portalName === 'customer' ? ['inventory', 'tank', 'mongodb', 'rabbitmq'] : ['orders', 'mongodb', 'rabbitmq', 'tank'];
        var lastUpdated = serviceResults && serviceResults.updatedAt ? serviceResults.updatedAt : new Date().toISOString();
        var stale = isStale(lastUpdated, staleAfterMs);
        var degraded = relevantKeys.some(function (key) { return results[key].degraded; }) || stale;
        var status = degraded ? 'degraded' : 'healthy';
        var state = { status: status, degraded: degraded, stale: stale, lastUpdated: lastUpdated, message: degraded ? 'Customer-facing data is temporarily delayed while the propane platform reconnects.' : 'Live operational data is current.', services: results };
        if (portalName === 'dispatch') {
          state.message = degraded ? 'Operations data is temporarily delayed while the dispatch pipeline recovers.' : 'Live dispatch telemetry is current.';
        }
        return state;
      }
      return { normalizeServiceState: normalizeServiceState, isStale: isStale, derivePortalState: derivePortalState };
    }());
    if (typeof window !== 'undefined') { window.PortalHealthState = PortalHealthState; }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function randF(min, max) { return +(min + Math.random() * (max - min)).toFixed(1); }

    function setDispatchBanner(status, message, timestamp) {
      const banner = document.getElementById('dispatch-banner');
      if (!banner) return;
      banner.style.display = 'block';
      banner.style.background = status === 'healthy' ? 'rgba(34,197,94,0.12)' : 'rgba(245,158,11,0.14)';
      banner.style.border = status === 'healthy' ? '1px solid rgba(34,197,94,0.3)' : '1px solid rgba(245,158,11,0.35)';
      banner.style.color = status === 'healthy' ? 'var(--green)' : 'var(--amber)';
      banner.innerHTML = '<strong>' + (status === 'healthy' ? 'All dispatch systems normal' : 'Platform visibility is temporarily degraded') + '.</strong> ' + message + (timestamp ? ' Last updated ' + new Date(timestamp).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) + '.' : '');
    }

    function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }

    // Domain: Cylinder Exchange
    function generateLocationData() {
      const next = LOCATIONS.map(loc => {
        const full = rand(2, 18);
        const transit = rand(0, 3);
        const empty = 20 - full - transit;
        const turnover = randF(1.5, 5.0);
        const stockoutHrs = full > 0 ? +(full / (turnover / 24)).toFixed(1) : 0;
        const nextDelivery = (full <= 6 && transit > 0) ? DELIVERY_TIMES[rand(0, 5)] :
                              full <= 10 ? DELIVERY_TIMES[rand(0, 6)] : DELIVERY_TIMES[rand(5, 7)];
        return { ...loc, full, empty, transit, turnover, stockoutHrs, nextDelivery };
      });
      LAST_KNOWN_LOCATION_DATA = next;
      locationData = next;
      return next;
    }

    function updateMetrics() {
      const source = DISPATCH_STATE.healthy ? locationData : (LAST_KNOWN_LOCATION_DATA.length ? LAST_KNOWN_LOCATION_DATA : locationData);
      const totalLocs = source.length ? source.length : rand(42, 48);
      const totalCylinders = source.reduce((sum, loc) => sum + loc.full + loc.transit, 0) || rand(680, 720);
      const critCount = source.filter(l => l.full <= 3).length || rand(2, 6);
      const avgFill = source.length ? (source.reduce((s, l) => s + l.full, 0) / (source.length * 20) * 100).toFixed(1) : randF(65, 85);
      const deliveries = rand(8, 18);
      const temps = [28, 35, 42, 55, 62, 70, 78];
      const tomorrowTemp = temps[rand(0, temps.length - 1)];
      const forecast = tomorrowTemp <= 35 ? 'High Demand' : tomorrowTemp <= 55 ? 'Normal' : 'Light';
      const fColor = forecast === 'High Demand' ? 'var(--red)' : forecast === 'Normal' ? 'var(--green)' : 'var(--cyan)';

      document.getElementById('m-locations').textContent = totalLocs;
      document.getElementById('m-cylinders').textContent = totalCylinders;
      document.getElementById('m-fill').innerHTML = avgFill + '<sub> %</sub>';
      document.getElementById('m-critical').textContent = critCount;
      document.getElementById('m-deliveries').textContent = deliveries;
      document.getElementById('m-forecast').innerHTML = '<span style="color:' + fColor + '">' + forecast + '</span>';
    }

    function renderCageGrid() {
      const container = document.getElementById('cage-grid');
      container.innerHTML = '';
      const data = DISPATCH_STATE.healthy ? locationData : (LAST_KNOWN_LOCATION_DATA.length ? LAST_KNOWN_LOCATION_DATA : locationData);
      data.forEach(loc => {
        const card = document.createElement('div');
        const isCritical = loc.full <= 3;
        card.className = 'cage-card' + (isCritical ? ' critical-loc' : '');

        let statusBadge, statusClass;
        if (loc.full > 10) { statusBadge = '&#9989; Stocked'; statusClass = 'stocked'; }
        else if (loc.full >= 4) { statusBadge = '&#9888;&#65039; Low Stock'; statusClass = 'low'; }
        else if (loc.transit > 0 && loc.full <= 6) { statusBadge = '&#128230; Restock Scheduled'; statusClass = 'restock'; }
        else { statusBadge = '&#128308; Critical'; statusClass = 'critical'; }

        let cylinders = '';
        let idx = 0;
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 5; c++) {
            let cls = 'cylinder ';
            if (idx < loc.full) cls += 'full';
            else if (idx < loc.full + loc.transit) cls += 'transit';
            else cls += 'empty';
            cylinders += '<div class="' + cls + '"></div>';
            idx++;
          }
        }

        card.innerHTML =
          '<div class="loc-header"><span class="loc-name">' + loc.name + '</span><span class="region-badge">' + loc.region + '</span></div>' +
          '<div class="cylinder-grid">' + cylinders + '</div>' +
          '<div class="summary">' + loc.full + ' Full | ' + loc.empty + ' Empty | ' + loc.transit + ' In-Transit</div>' +
          '<span class="status-badge ' + statusClass + '">' + statusBadge + '</span>' +
          '<div class="detail-row"><span>Next: ' + loc.nextDelivery + '</span><span>~' + loc.turnover + ' cylinders/day</span></div>';
        container.appendChild(card);
      });
    }

    function renderDeliveryQueue() {
      const tbody = document.getElementById('delivery-body');
      tbody.innerHTML = '';
      const data = DISPATCH_STATE.healthy ? locationData : (LAST_KNOWN_LOCATION_DATA.length ? LAST_KNOWN_LOCATION_DATA : locationData);
      const sorted = [...data].sort((a, b) => a.stockoutHrs - b.stockoutHrs).slice(0, 10);
      sorted.forEach(loc => {
        let prioLabel, prioClass;
        if (loc.stockoutHrs < 12) { prioLabel = 'URGENT'; prioClass = 'offline'; }
        else if (loc.stockoutHrs < 24) { prioLabel = 'HIGH'; prioClass = 'warning'; }
        else { prioLabel = 'NORMAL'; prioClass = 'online'; }
        const schedHtml = loc.nextDelivery === 'None Scheduled'
          ? '<span style="color:var(--red);font-weight:600">UNSCHEDULED</span>'
          : loc.nextDelivery;
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + loc.name + '</td>' +
          '<td>' + loc.full + ' / 20</td>' +
          '<td>' + loc.empty + '</td>' +
          '<td>~' + loc.turnover + '/day</td>' +
          '<td>' + loc.stockoutHrs + 'h</td>' +
          '<td><span class="badge ' + prioClass + '">' + prioLabel + '</span></td>' +
          '<td>' + schedHtml + '</td>';
        tbody.appendChild(tr);
      });
    }

    function renderForecast() {
      const tbody = document.getElementById('forecast-body');
      tbody.innerHTML = '';
      DAYS.forEach((day, i) => {
        const temp = rand(22, 82);
        let level, levelClass;
        if (temp <= 35) { level = 'High'; levelClass = 'demand-high'; }
        else if (temp <= 60) { level = 'Normal'; levelClass = 'demand-normal'; }
        else { level = 'Low'; levelClass = 'demand-low'; }
        const est = level === 'High' ? rand(50, 80) : level === 'Normal' ? rand(25, 50) : rand(10, 25);
        const note = FORECAST_NOTES[rand(0, FORECAST_NOTES.length - 1)];
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + day + '</td>' +
          '<td>' + temp + '&deg;F</td>' +
          '<td><span class="' + levelClass + '">' + level + '</span></td>' +
          '<td>' + est + '</td>' +
          '<td style="color:var(--muted);font-size:.8rem">' + note + '</td>';
        tbody.appendChild(tr);
      });
    }

    const LOG_MESSAGES = [
      { level: 'info', msg: 'Cage restocked at Home Depot KoP: +20 cylinders' },
      { level: 'warn', msg: 'Low stock alert: ACE Lansdale down to {n} full cylinders' },
      { level: 'info', msg: 'Delivery truck T-{id} en route to Walmart Collegeville (ETA {n}min)' },
      { level: 'info', msg: 'Daily cage audit complete: {n} locations below threshold' },
      { level: 'warn', msg: 'Temperature drop forecast — demand increase expected Thu-Fri' },
      { level: 'info', msg: 'Restock priority recalculated: {n} urgent locations' },
      { level: 'info', msg: 'Cage swap completed at Giant Pottstown: 18 full cylinders placed' },
      { level: 'err',  msg: 'Connection timeout to MongoDB replica' },
      { level: 'warn', msg: 'Costco Plymouth Meeting cage at capacity — hold deliveries' },
      { level: 'info', msg: 'RabbitMQ consumer reconnected successfully' },
      { level: 'info', msg: "Lowe's Exton cage inspection passed — all seals intact" },
      { level: 'warn', msg: 'Delivery T-{id} delayed: traffic on I-76 ({n}min ETA slip)' },
    ];

    function addLogEntry() {
      const box = document.getElementById('ops-log');
      const tmpl = LOG_MESSAGES[rand(0, LOG_MESSAGES.length - 1)];
      const ts = new Date().toLocaleTimeString();
      const text = tmpl.msg.replace('{id}', rand(1000, 9999)).replace('{n}', rand(2, 60));
      const line = document.createElement('div');
      line.innerHTML = '<span class="ts">[' + ts + ']</span> <span class="' + tmpl.level + '">[' + tmpl.level.toUpperCase() + ']</span> ' + text;
      box.prepend(line);
      if (box.children.length > 50) box.removeChild(box.lastChild);
    }

    // Domain: Shared
    function fetchHealth(url){
      return fetch(url, { signal: AbortSignal.timeout(3000) })
        .then(function(response){
          if (!response.ok) return Promise.reject(new Error('HTTP ' + response.status));
          return { ok: true, status: response.status };
        })
        .catch(function(err){
          return { ok: false, status: err && err.message ? err.message : 'unreachable' };
        });
    }

    function applyDispatchState(healthy, message, timestamp){
      DISPATCH_STATE = { healthy: healthy, message: message, lastUpdated: timestamp || new Date().toISOString() };
      if (healthy) {
        setDispatchBanner('healthy', message || 'Live dispatch telemetry is current.', DISPATCH_STATE.lastUpdated);
      } else {
        setDispatchBanner('degraded', message || 'Operations data is temporarily delayed while the dispatch pipeline recovers.', DISPATCH_STATE.lastUpdated);
      }
    }

    function loadHealth() {
      const grid = document.getElementById('health-grid');
      grid.innerHTML = '';
      Promise.all([
        fetchHealth('/api/inventory/health'),
        fetchHealth('/api/tanks/health'),
        fetchHealth('/api/orders/health')
      ]).then(function(results){
        const inventory = results[0];
        const tank = results[1];
        const orders = results[2];
        const state = PortalHealthState.derivePortalState({
          inventory: inventory,
          tank: tank,
          orders: orders,
          updatedAt: new Date().toISOString()
        }, 'dispatch', 30000);
        applyDispatchState(!state.degraded, state.message, state.lastUpdated);
        const svcs = [
          { name: 'Inventory Service', ok: inventory.ok, detail: inventory.ok ? 'Inventory stream responding normally.' : 'HTTP ' + inventory.status },
          { name: 'Tank Monitor', ok: tank.ok, detail: tank.ok ? 'Tank telemetry is flowing.' : 'HTTP ' + tank.status },
          { name: 'Order Service', ok: orders.ok, detail: orders.ok ? 'Orders flow is normal.' : 'HTTP ' + orders.status },
          { name: 'MongoDB', ok: !state.services.mongodb.degraded, detail: state.services.mongodb.degraded ? 'Dependency issue detected; stale dashboard values are being shown.' : 'MongoDB dependency is healthy.' },
          { name: 'RabbitMQ', ok: !state.services.rabbitmq.degraded, detail: state.services.rabbitmq.degraded ? 'Dependency issue detected; queue-driven updates are delayed.' : 'RabbitMQ dependency is healthy.' },
        ];
        svcs.forEach(svc => {
          const card = document.createElement('div');
          card.className = 'card';
          const color = svc.ok ? 'var(--green)' : 'var(--red)';
          const dotName = svc.ok ? 'green' : 'red';
          card.innerHTML = '<h3>' + svc.name + '</h3><div style="font-size:1.1rem;font-weight:600;color:' + color + '"><span class="dot ' + dotName + '"></span> ' + (svc.ok ? 'Healthy' : 'Degraded') + '</div><div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">' + svc.detail + '</div>';
          grid.appendChild(card);
        });
      }).catch(function(){
        applyDispatchState(false, 'Operations data is temporarily delayed while the platform reconnects.', new Date().toISOString());
        const svcs = [
          { name: 'Inventory Service', ok: false, detail: 'Service check failed' },
          { name: 'Tank Monitor', ok: false, detail: 'Service check failed' },
          { name: 'Order Service', ok: false, detail: 'Service check failed' },
          { name: 'MongoDB', ok: false, detail: 'Dependency status uncertain; stale operational values are being shown.' },
          { name: 'RabbitMQ', ok: false, detail: 'Dependency status uncertain; queue-driven automation is delayed.' },
        ];
        svcs.forEach(svc => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<h3>' + svc.name + '</h3><div style="font-size:1.1rem;font-weight:600;color:var(--red)"><span class="dot red"></span> Degraded</div><div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">' + svc.detail + '</div>';
          grid.appendChild(card);
        });
      });
    }

    function refreshCages() { generateLocationData(); renderCageGrid(); renderDeliveryQueue(); }

    // Domain: Shared
    generateLocationData();
    setDispatchBanner('healthy', 'Live dispatch telemetry is current.', new Date().toISOString());
    updateClock(); updateMetrics(); renderCageGrid(); renderDeliveryQueue(); renderForecast(); loadHealth();
    for (let i = 0; i < 10; i++) addLogEntry();
    setInterval(updateClock, 1000);
    setInterval(updateMetrics, 5000);
    setInterval(refreshCages, 10000);
    setInterval(addLogEntry, 4000);
    setInterval(loadHealth, 30000);
    setInterval(renderForecast, 60000);
    </script>
    </body>
    </html>


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-console-nginx
  namespace: propane
data:
  default.conf: |
    server {
        listen 8081;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;

        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
        location = /api/inventory/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://inventory-service.propane.svc.cluster.local:3002/health;
        }
        location = /api/tanks/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tank-monitor.propane.svc.cluster.local:3000/health;
        }
        location = /api/orders/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://order-service.propane.svc.cluster.local:3001/health;
        }
        location /api/ {
            return 404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-console
  namespace: propane
  labels:
    app: dispatch-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatch-console
  template:
    metadata:
      labels:
        app: dispatch-console
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: dispatch-console
          image: nginx:alpine
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: dispatch-console-html
        - name: nginx-conf
          configMap:
            name: dispatch-console-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-console
  namespace: propane
spec:
  type: LoadBalancer
  selector:
    app: dispatch-console
  ports:
    - port: 80
      targetPort: 8081

---
# =============================================================================
# OpenTelemetry Collector - Telemetry pipeline (App Insights + ADX via stdout)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: propane
data:
  otel-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'propane-services'
              scrape_interval: 30s
              static_configs:
                - targets:
                    - tank-monitor.propane.svc.cluster.local:3000
                    - inventory-service.propane.svc.cluster.local:3002
                    - order-service.propane.svc.cluster.local:3001
    processors:
      batch:
        timeout: 10s
        send_batch_size: 256
      memory_limiter:
        limit_mib: 256
        spike_limit_mib: 64
        check_interval: 5s
      resource:
        attributes:
          - key: cloud.provider
            value: azure
            action: upsert
          - key: cloud.platform
            value: azure_aks
            action: upsert
          - key: service.namespace
            value: propane
            action: upsert
    exporters:
      logging:
        loglevel: info
      otlp/appinsights:
        endpoint: "${APPLICATIONINSIGHTS_CONNECTION_STRING}"
        headers:
          "Content-Type": "application/json"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [logging]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch, resource]
          exporters: [logging]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [logging]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: propane
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args: ["--config=/etc/otel/otel-config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: propane
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

---
# =============================================================================
# Usage Simulator - Customer propane usage pattern generator
# Domain: Bulk Tank — generates simulated residential/commercial bulk tank
# consumption (gallons) against the Tank Monitor API only.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-simulator
  namespace: propane
  labels:
    app: usage-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usage-simulator
  template:
    metadata:
      labels:
        app: usage-simulator
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: usage-simulator
          image: ghcr.io/azure-samples/aks-store-demo/virtual-customer:latest
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: ORDER_SERVICE_URL
              value: "http://tank-monitor:3000/"
            - name: ORDERS_PER_HOUR
              value: "100"
            - name: OTEL_SERVICE_NAME
              value: "usage-simulator"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config

---
# =============================================================================
# Order Worker - Order processing worker (disabled by default)
# Domain: Shared — consumes the same order queue as Order Service, covering
# both Bulk Tank delivery and Cylinder Exchange restock orders.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: propane
  labels:
    app: order-worker
spec:
  replicas: 0 # Disabled: AMQP protocol mismatch with RabbitMQ 3.11
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: order-worker
          image: ghcr.io/azure-samples/aks-store-demo/virtual-worker:latest
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: MAKELINE_SERVICE_URL
              value: "http://order-service:3001"
            - name: ORDERS_PER_HOUR
              value: "100"
            - name: OTEL_SERVICE_NAME
              value: "order-worker"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config