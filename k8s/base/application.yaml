# =============================================================================
# Customer Portal - Customer self-service portal (nginx serving custom HTML)
# Domain: Shared UI — hosts two distinct domain sections in one portal:
#   1. Bulk Tank (residential/commercial delivery account: gallons, tank
#      percentage, consumption, refill recommendation, delivery scheduling)
#   2. Cylinder Exchange (retail cage locations: full/empty/reserved
#      cylinder counts, cage replenishment, exchange-location terminology)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-portal-html
  namespace: propane
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmeriGas — My Account</title>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --accent: #003DA5; --orange: #FF6900; --green: #34d399; --amber: #fbbf24; --red: #f87171; --text: #e2e8f0; --muted: #94a3b8; --border: #334155; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      header { background: linear-gradient(135deg, #001d52 0%, #003DA5 100%); border-bottom: 3px solid var(--orange); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
      header h1 { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; }
      .status-bar { display: flex; gap: 1.5rem; font-size: .85rem; align-items: center; }
      .status-bar .item { display: flex; align-items: center; gap: .4rem; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
      .dot.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
      .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
      main { padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
      .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
      .card { background: var(--card); border-radius: 10px; padding: 1.2rem; border: 1px solid var(--border); }
      .card h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .6rem; }
      .metric { font-size: 2rem; font-weight: 700; }
      .metric sub { font-size: .7rem; font-weight: 400; color: var(--muted); }
      .section-title { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 .8rem; color: var(--orange); border-bottom: 1px solid var(--border); padding-bottom: .4rem; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: .55rem .8rem; text-align: left; border-bottom: 1px solid var(--border); font-size: .85rem; }
      th { color: var(--muted); text-transform: uppercase; font-size: .72rem; letter-spacing: .06em; }
      .badge { padding: .15rem .55rem; border-radius: 4px; font-size: .72rem; font-weight: 600; white-space: nowrap; }
      .badge.in-stock { background: #064e3b; color: var(--green); }
      .badge.low-stock { background: #78350f; color: var(--amber); }
      .badge.out-of-stock { background: #7f1d1d; color: var(--red); }
      .badge.online { background: #064e3b; color: var(--green); }
      .badge.offline { background: #7f1d1d; color: var(--red); }
      .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
      /* Gauge */
      .gauge-wrap { display: flex; align-items: center; gap: 1rem; }
      .gauge { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
      .gauge-inner { width: 58px; height: 58px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; }
      .gauge-label { font-size: .8rem; color: var(--muted); }
      /* Cylinder Exchange cage viz */
      .cage { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
      .cylinder-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
      .cylinder-dot.full { background: var(--accent); box-shadow: 0 0 3px rgba(0,61,165,.5); }
      .cylinder-dot.empty { background: var(--border); }
      .cylinder-dot.reserved { background: var(--orange); box-shadow: 0 0 3px rgba(255,105,0,.4); }
      .cage-counts { font-size: .75rem; color: var(--muted); margin-top: 3px; }
      .domain-tag { font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: -.5rem 0 .8rem; }
      .loc-row:hover { background: rgba(51,65,85,.4); }
      .footer { text-align: center; padding: 2rem; color: var(--muted); font-size: .75rem; border-top: 1px solid var(--border); margin-top: 2rem; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
      .loading { animation: pulse 1.5s infinite; color: var(--muted); }
      .demand-peak { color: var(--red); font-weight: 700; }
      .demand-normal { color: var(--amber); font-weight: 700; }
      .demand-low { color: var(--green); font-weight: 700; }
    </style>
    </head>
    <body>
    <header>
      <h1>&#128293; AmeriGas Propane &mdash; My Account</h1>
      <div class="status-bar">
        <div class="item"><span class="dot green"></span> Account Active</div>
        <div class="item" id="clock"></div>
      </div>
    </header>
    <main>
      <div id="portal-banner" style="display:none;margin:0 0 1rem;padding:.8rem 1rem;border-radius:10px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.12);color:var(--green);font-size:.85rem;line-height:1.4;"></div>
      <!-- Domain: Bulk Tank -->
      <h2 class="section-title">&#128738; My Bulk Tank</h2>
      <div class="domain-tag">Bulk Tank Account &mdash; gallons &amp; tank percentage</div>
      <!-- Top Metrics -->
      <div class="metrics-grid">
        <div class="card">
          <h3>My Tank Level</h3>
          <div class="gauge-wrap">
            <div class="gauge" id="tank-gauge"><div class="gauge-inner" id="tank-pct">--%</div></div>
            <div class="gauge-label" id="tank-status">Calculating&hellip;</div>
          </div>
        </div>
        <div class="card">
          <h3>Est. Days Until Empty</h3>
          <div class="metric" id="days-empty" style="color:var(--amber)">--<sub> days</sub></div>
        </div>
        <div class="card">
          <h3>Next Delivery</h3>
          <div id="next-delivery" style="font-size:1.1rem;font-weight:600;color:var(--green)">--</div>
          <div id="delivery-window" style="font-size:.8rem;color:var(--muted);margin-top:.3rem"></div>
        </div>
        <div class="card">
          <h3>Current Price</h3>
          <div class="metric" id="current-price" style="color:var(--text)">--<sub> /gal</sub></div>
        </div>
        <div class="card">
          <h3>Season Demand</h3>
          <div id="season-demand" style="font-size:1.4rem;font-weight:700">--</div>
        </div>
        <div class="card">
          <h3>Account Balance</h3>
          <div class="metric" id="acct-balance" style="color:var(--green)">--</div>
        </div>
      </div>

      <!-- Usage History -->
      <h2 class="section-title">&#128202; My Bulk Tank Usage History</h2>
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead><tr><th>Date</th><th>Gallons Used</th><th>Tank Level</th><th>Daily Avg</th></tr></thead>
          <tbody id="usage-body"></tbody>
        </table>
      </div>

      <!-- Domain: Cylinder Exchange -->
      <h2 class="section-title">&#127978; Nearby Exchange Locations</h2>
      <div class="domain-tag">Cylinder Exchange &mdash; full / empty / reserved cylinder counts</div>
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>Location</th><th>Region</th><th>Cage Inventory</th><th>Cylinder Counts</th><th>Status</th><th>Distance</th></tr>
          </thead>
          <tbody id="locations-body">
            <tr><td colspan="6" class="loading">Loading exchange locations&hellip;</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Service Health -->
      <h2 class="section-title">&#128295; Service Health</h2>
      <div class="health-grid" id="health-cards"></div>
    </main>
    <div class="footer">AmeriGas &mdash; Propane Distribution Platform &mdash; Azure SRE Agent Demo Lab</div>

    <script>
    /* ---- helpers (Domain: Shared) ---- */
    function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
    function randF(a,b){return+(Math.random()*(b-a)+a).toFixed(2);}
    function fmt(n){return n.toLocaleString();}
    var PortalHealthState = (typeof window !== 'undefined' && window.PortalHealthState) || (function () {
      function normalizeServiceState(service) {
        if (!service) return { ok: true, code: 'unknown', degraded: false, name: 'Service' };
        if (typeof service.ok === 'boolean') {
          return { ok: service.ok, code: service.code || service.status || (service.ok ? 200 : 500), degraded: !service.ok, name: service.name || 'Service' };
        }
        var numericStatus = Number(service.status || service.code || 0);
        var ok = service.status === undefined && service.code === undefined ? true : numericStatus >= 200 && numericStatus < 500;
        return { ok: ok, code: numericStatus || 'unknown', degraded: !ok, name: service.name || 'Service' };
      }
      function isStale(updatedAt, staleAfterMs) {
        if (!updatedAt) return false;
        var timestamp = new Date(updatedAt).getTime();
        if (Number.isNaN(timestamp)) return false;
        return Date.now() - timestamp > (staleAfterMs || 30000);
      }
      function derivePortalState(serviceResults, portalName, staleAfterMs) {
        var serviceResultsSafe = serviceResults || {};
        var results = {
          inventory: normalizeServiceState(serviceResultsSafe.inventory),
          tank: normalizeServiceState(serviceResultsSafe.tank),
          orders: normalizeServiceState(serviceResultsSafe.orders),
          mongodb: serviceResultsSafe.mongodb ? normalizeServiceState(serviceResultsSafe.mongodb) : { ok: true, code: 200, degraded: false, name: 'MongoDB' },
          rabbitmq: serviceResultsSafe.rabbitmq ? normalizeServiceState(serviceResultsSafe.rabbitmq) : { ok: true, code: 200, degraded: false, name: 'RabbitMQ' }
        };
        var derivedMongoOk = results.inventory.ok && results.orders.ok && !results.mongodb.degraded;
        var derivedRabbitOk = results.tank.ok && results.orders.ok && !results.rabbitmq.degraded;
        results.mongodb = Object.assign({}, results.mongodb, { ok: derivedMongoOk, degraded: !derivedMongoOk, code: derivedMongoOk ? 200 : 503 });
        results.rabbitmq = Object.assign({}, results.rabbitmq, { ok: derivedRabbitOk, degraded: !derivedRabbitOk, code: derivedRabbitOk ? 200 : 503 });
        var relevantKeys = portalName === 'customer' ? ['inventory', 'tank', 'mongodb', 'rabbitmq'] : ['orders', 'mongodb', 'rabbitmq', 'tank'];
        var lastUpdated = serviceResults && serviceResults.updatedAt ? serviceResults.updatedAt : new Date().toISOString();
        var stale = isStale(lastUpdated, staleAfterMs);
        var degraded = relevantKeys.some(function (key) { return results[key].degraded; }) || stale;
        var status = degraded ? 'degraded' : 'healthy';
        var state = { status: status, degraded: degraded, stale: stale, lastUpdated: lastUpdated, message: degraded ? 'Customer-facing data is temporarily delayed while the propane platform reconnects.' : 'Live operational data is current.', services: results };
        if (portalName === 'dispatch') {
          state.message = degraded ? 'Operations data is temporarily delayed while the dispatch pipeline recovers.' : 'Live dispatch telemetry is current.';
        }
        return state;
      }
      return { normalizeServiceState: normalizeServiceState, isStale: isStale, derivePortalState: derivePortalState };
    }());
    if (typeof window !== 'undefined') { window.PortalHealthState = PortalHealthState; }
    var LAST_KNOWN_METRICS=null;
    var LAST_KNOWN_LOCATIONS=null;
    var LAST_KNOWN_USAGE=null;
    var PORTAL_STATE={healthy:true,message:'Live operational data is current.',lastUpdated:new Date().toISOString()};
    function setPortalBanner(status,message,timestamp){
      var banner=document.getElementById('portal-banner');
      if(!banner){return;}
      banner.style.display='block';
      banner.style.background=status==='healthy'?'rgba(34,197,94,0.12)':'rgba(245,158,11,0.14)';
      banner.style.border=status==='healthy'?'1px solid rgba(34,197,94,0.3)':'1px solid rgba(245,158,11,0.35)';
      banner.style.color=status==='healthy'?'var(--green)':'var(--amber)';
      banner.innerHTML='<strong>' + (status==='healthy'?'All systems normal':'Customer visibility is temporarily degraded') + '.</strong> ' + message + (timestamp ? ' Last updated ' + new Date(timestamp).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) + '.' : '');
    }
    /* ---- bulk tank forecast (Domain: Bulk Tank) ---- */
    // Simulated operational defaults for the demo only — AmeriGas operations SMEs must validate before describing these thresholds as policy.
    var BULK_TANK_POLICY = {
      profileId: 'bulk-tank-fixture-01',
      customerId: 'CUST-1842',
      tankName: 'Primary Residence Tank',
      capacityGallons: 500,
      reserveGallons: 100,
      refillThresholdPct: 35,
      criticalThresholdPct: 25,
      leadTimeDays: 3,
      pricePerGallon: 2.42,
      currentGallons: 170,
      baseDemandGalPerDay: 4.5,
      weatherSensitivity: 1.45,
      temperatureF: 32
    };
    function clampBulkValue(value, min, max){
      if(!Number.isFinite(value)){ return min; }
      return Math.min(Math.max(value, min), max);
    }
    function normalizeBulkTankPolicy(policy){
      var merged = Object.assign({}, BULK_TANK_POLICY, policy || {});
      if(!Number.isFinite(merged.capacityGallons) || merged.capacityGallons <= 0){ throw new Error('Bulk Tank policy requires a positive capacityGallons value.'); }
      if(!Number.isFinite(merged.reserveGallons) || merged.reserveGallons < 0 || merged.reserveGallons >= merged.capacityGallons || merged.reserveGallons > merged.capacityGallons * 0.5){ throw new Error('Bulk Tank reserveGallons must be between 0 and 50% of capacityGallons.'); }
      if(!Number.isFinite(merged.refillThresholdPct) || merged.refillThresholdPct <= 0 || merged.refillThresholdPct >= 100){ throw new Error('Bulk Tank refillThresholdPct must be between 0 and 100.'); }
      if(!Number.isFinite(merged.criticalThresholdPct) || merged.criticalThresholdPct <= 0 || merged.criticalThresholdPct >= merged.refillThresholdPct){ throw new Error('Bulk Tank criticalThresholdPct must be below refillThresholdPct.'); }
      if(!Number.isFinite(merged.leadTimeDays) || merged.leadTimeDays < 0){ throw new Error('Bulk Tank leadTimeDays must be zero or greater.'); }
      if(!Number.isFinite(merged.baseDemandGalPerDay) || merged.baseDemandGalPerDay <= 0){ throw new Error('Bulk Tank baseDemandGalPerDay must be a finite number greater than 0.'); }
      if(!Number.isFinite(merged.weatherSensitivity) || merged.weatherSensitivity < 0){ throw new Error('Bulk Tank weatherSensitivity must be a finite number greater than or equal to 0.'); }
      if(!Number.isFinite(merged.temperatureF)){ throw new Error('Bulk Tank temperatureF must be a finite number.'); }
      return {
        profileId: String(merged.profileId || BULK_TANK_POLICY.profileId),
        customerId: String(merged.customerId || BULK_TANK_POLICY.customerId),
        tankName: String(merged.tankName || BULK_TANK_POLICY.tankName),
        capacityGallons: Number(merged.capacityGallons),
        reserveGallons: Number(merged.reserveGallons),
        refillThresholdPct: Number(merged.refillThresholdPct),
        criticalThresholdPct: Number(merged.criticalThresholdPct),
        leadTimeDays: Number(merged.leadTimeDays),
        pricePerGallon: Number(merged.pricePerGallon),
        currentGallons: clampBulkValue(Number(merged.currentGallons), 0, Number(merged.capacityGallons)),
        baseDemandGalPerDay: Number(merged.baseDemandGalPerDay),
        weatherSensitivity: Number(merged.weatherSensitivity),
        temperatureF: Number(merged.temperatureF)
      };
    }
    function calculateDemandFactor(tempF, sensitivity, baselineTempF){
      var tempValue = Number(tempF);
      var sensitivityValue = Number(sensitivity);
      if(!Number.isFinite(tempValue) || !Number.isFinite(sensitivityValue) || sensitivityValue < 0){ throw new Error('Bulk Tank demand inputs must remain finite and weatherSensitivity cannot be negative.'); }
      var delta = Math.max(0, Number(baselineTempF) - tempValue);
      return +(1 + (delta / 35) * sensitivityValue).toFixed(3);
    }
    function getDemandDays(currentGallons, demandGallonsPerDay){
      if(!Number.isFinite(currentGallons) || currentGallons <= 0){ return 0; }
      if(!Number.isFinite(demandGallonsPerDay) || demandGallonsPerDay <= 0){ return Number.POSITIVE_INFINITY; }
      return currentGallons / demandGallonsPerDay;
    }
    function computeBulkTankProjection(policy, portalName){
      var normalized = normalizeBulkTankPolicy(policy);
      var currentGallons = clampBulkValue(Number(normalized.currentGallons), 0, Number(normalized.capacityGallons));
      var usableGallons = Math.max(currentGallons - Number(normalized.reserveGallons), 0);
      var tankLevelPct = (currentGallons / Number(normalized.capacityGallons)) * 100;
      var demandFactor = calculateDemandFactor(normalized.temperatureF, normalized.weatherSensitivity, 60);
      var projectedDemand = normalized.baseDemandGalPerDay * demandFactor;
      var daysToEmpty = getDemandDays(currentGallons, projectedDemand);
      var thresholdGallons = normalized.capacityGallons * (normalized.refillThresholdPct / 100);
      var thresholdCrossed = currentGallons <= thresholdGallons;
      var reserveBreachDays = getDemandDays(usableGallons, projectedDemand);
      var recommendedDaysOut = Number.isFinite(reserveBreachDays) ? Math.max(0, reserveBreachDays - normalized.leadTimeDays) : 0;
      var recommendedDeliveryDate = new Date();
      recommendedDeliveryDate.setDate(recommendedDeliveryDate.getDate() + Math.max(0, Math.floor(recommendedDaysOut)));
      var shouldRecommend = thresholdCrossed || (Number.isFinite(reserveBreachDays) && reserveBreachDays <= normalized.leadTimeDays);
      var seasonDemand = normalized.temperatureF <= 35 ? 'Peak' : (normalized.temperatureF <= 55 ? 'Normal' : 'Low');
      var seasonClass = seasonDemand === 'Peak' ? 'demand-peak' : seasonDemand === 'Normal' ? 'demand-normal' : 'demand-low';
      return {
        profileId: normalized.profileId,
        customerId: normalized.customerId,
        tankName: normalized.tankName,
        domain: 'Bulk Tank',
        portalName: portalName || 'customer',
        capacityGallons: Number(normalized.capacityGallons),
        reserveGallons: Number(normalized.reserveGallons),
        refillThresholdPct: Number(normalized.refillThresholdPct),
        criticalThresholdPct: Number(normalized.criticalThresholdPct),
        leadTimeDays: Number(normalized.leadTimeDays),
        currentGallons: +currentGallons.toFixed(1),
        tankLevelPct: +tankLevelPct.toFixed(1),
        usableGallons: +usableGallons.toFixed(1),
        pricePerGallon: Number(normalized.pricePerGallon),
        temperatureF: Number(normalized.temperatureF),
        demandFactor: +demandFactor.toFixed(3),
        projectedDemandGalPerDay: +projectedDemand.toFixed(2),
        seasonDemand: seasonDemand,
        seasonClass: seasonClass,
        daysToEmpty: +daysToEmpty.toFixed(1),
        reserveBreachDays: +reserveBreachDays.toFixed(1),
        shouldRecommendDelivery: shouldRecommend,
        recommendedDeliveryDaysOut: +recommendedDaysOut.toFixed(1),
        recommendedDeliveryDate: recommendedDeliveryDate.toISOString(),
        recommendationReason: shouldRecommend ? 'Delivery recommended before the configured reserve breach window.' : 'Current forecast remains above the configured refill threshold.'
      };
    }
    function makeMetricSnapshot(){
      var projection = computeBulkTankProjection(BULK_TANK_POLICY, 'customer');
      var gaugeColor = projection.tankLevelPct > projection.refillThresholdPct ? 'var(--green)' : projection.tankLevelPct > projection.criticalThresholdPct ? 'var(--amber)' : 'var(--red)';
      var statusText = projection.tankLevelPct > projection.refillThresholdPct ? 'Good — no action needed' : projection.tankLevelPct > projection.criticalThresholdPct ? 'Monitor — consider ordering' : 'Low — delivery recommended';
      var dd = new Date(projection.recommendedDeliveryDate);
      var opts = {weekday:'short',month:'short',day:'numeric'};
      return {
        pct: Math.round(projection.tankLevelPct),
        gaugeColor: gaugeColor,
        statusText: statusText,
        days: Math.max(1, Math.ceil(projection.daysToEmpty)),
        nextDelivery: dd.toLocaleDateString('en-US', opts),
        deliveryWindow: projection.shouldRecommendDelivery ? 'delivery before reserve breach' : 'normal schedule',
        price: projection.pricePerGallon,
        season: projection.seasonDemand,
        cls: projection.seasonClass,
        balance: 125,
        balanceText: '$125.00 credit',
        balanceColor: 'var(--green)'
      };
    }

    /* ---- clock (Domain: Shared) ---- */
    function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}

    /* ---- top metrics (Domain: Bulk Tank) ---- */
    function updateMetrics(){
      var snapshot=PORTAL_STATE.healthy ? makeMetricSnapshot() : (LAST_KNOWN_METRICS || makeMetricSnapshot());
      LAST_KNOWN_METRICS=snapshot;
      PORTAL_STATE.lastUpdated=new Date().toISOString();
      var pct=snapshot.pct;
      var gaugeColor=snapshot.gaugeColor;
      var g=document.getElementById('tank-gauge');
      g.style.background='conic-gradient('+gaugeColor+' 0% '+pct+'%, var(--border) '+pct+'% 100%)';
      document.getElementById('tank-pct').textContent=pct+'%';
      document.getElementById('tank-status').textContent=snapshot.statusText;

      var de=document.getElementById('days-empty');
      de.innerHTML=snapshot.days+'<sub> days</sub>';
      de.style.color=snapshot.days>14?'var(--green)':snapshot.days>7?'var(--amber)':'var(--red)';

      document.getElementById('next-delivery').textContent=snapshot.nextDelivery;
      document.getElementById('delivery-window').textContent=snapshot.deliveryWindow;

      document.getElementById('current-price').innerHTML='$'+snapshot.price.toFixed(2)+'<sub> /gal</sub>';

      var sd=document.getElementById('season-demand');
      sd.textContent=snapshot.season;sd.className=snapshot.cls;

      var be=document.getElementById('acct-balance');
      be.textContent=snapshot.balanceText;
      be.style.color=snapshot.balanceColor;
    }

    /* ---- exchange locations (Domain: Cylinder Exchange) ---- */
    var LOCATIONS=[
      {name:'Home Depot King of Prussia',region:'PA-East',cageSize:20,dist:'2.3 mi'},
      {name:'Walmart Collegeville',region:'PA-East',cageSize:20,dist:'4.1 mi'},
      {name:"Lowe's Exton",region:'PA-East',cageSize:12,dist:'6.8 mi'},
      {name:'ACE Hardware Lansdale',region:'PA-East',cageSize:12,dist:'8.2 mi'},
      {name:'Wawa Wayne',region:'PA-East',cageSize:12,dist:'3.5 mi'},
      {name:'ShopRite Norristown',region:'PA-Central',cageSize:20,dist:'5.6 mi'},
      {name:'Giant Pottstown',region:'PA-Central',cageSize:20,dist:'12.4 mi'},
      {name:'Costco Plymouth Meeting',region:'NJ-North',cageSize:24,dist:'7.9 mi'}
    ];

    function computeLocationRows(){
      return LOCATIONS.map(function(loc){
        var full=rand(0,loc.cageSize);
        var reserved=full>0?rand(0,Math.min(3,full)):0;
        full=full-reserved;
        var empty=loc.cageSize-full-reserved;
        var statusClass,statusLabel;
        if(full===0){statusClass='out-of-stock';statusLabel='Out of Stock';}
        else if(full<=3){statusClass='low-stock';statusLabel='Low Stock';}
        else{statusClass='in-stock';statusLabel='In Stock';}
        return {
          name:loc.name,
          region:loc.region,
          dist:loc.dist,
          cageSize:loc.cageSize,
          dots:{ full:full, empty:empty, reserved:reserved },
          statusClass:statusClass,
          statusLabel:statusLabel
        };
      });
    }

    function loadLocations(){
      var rows=PORTAL_STATE.healthy ? computeLocationRows() : (LAST_KNOWN_LOCATIONS || computeLocationRows());
      LAST_KNOWN_LOCATIONS=rows;
      var tbody=document.getElementById('locations-body');
      tbody.innerHTML='';
      rows.forEach(function(loc){
        var dots='';
        for(var i=0;i<loc.dots.full;i++) dots+='<span class="cylinder-dot full"></span>';
        for(var i=0;i<loc.dots.empty;i++) dots+='<span class="cylinder-dot empty"></span>';
        for(var i=0;i<loc.dots.reserved;i++) dots+='<span class="cylinder-dot reserved"></span>';
        var tr=document.createElement('tr');
        tr.className='loc-row';
        tr.innerHTML='<td style="font-weight:600">'+loc.name+'</td>'+
          '<td>'+loc.region+'</td>'+
          '<td><div class="cage">'+dots+'</div></td>'+
          '<td><div class="cage-counts">'+loc.dots.full+' Full / '+loc.dots.empty+' Empty / '+loc.dots.reserved+' Reserved (cylinders)</div></td>'+
          '<td><span class="badge '+loc.statusClass+'">'+loc.statusLabel+'</span></td>'+
          '<td>'+loc.dist+'</td>';
        tbody.appendChild(tr);
      });
    }

    /* ---- usage history (Domain: Bulk Tank) ---- */
    function computeUsageRows(){
      var projection = computeBulkTankProjection(BULK_TANK_POLICY, 'customer');
      var rows=[];
      var level = projection.currentGallons;
      for(var i=0;i<8;i++){
        var d=new Date();d.setDate(d.getDate()-i*7);
        var used = +(projection.projectedDemandGalPerDay * (i + 1.2)).toFixed(1);
        level = Math.max(45, level - (projection.projectedDemandGalPerDay * (i + 1.25)));
        rows.push({
          date:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
          used:used.toFixed(1)+' gal',
          level: Math.round((level / projection.capacityGallons) * 100) + '%',
          avg:projection.projectedDemandGalPerDay.toFixed(1)+' gal/day'
        });
      }
      return rows;
    }

    function loadUsage(){
      var rows=PORTAL_STATE.healthy ? computeUsageRows() : (LAST_KNOWN_USAGE || computeUsageRows());
      LAST_KNOWN_USAGE=rows;
      var tbody=document.getElementById('usage-body');
      tbody.innerHTML='';
      rows.forEach(function(row){
        var tr=document.createElement('tr');
        tr.innerHTML='<td>'+row.date+'</td>'+
          '<td>'+row.used+'</td>'+
          '<td>'+row.level+'</td>'+
          '<td>'+row.avg+'</td>';
        tbody.appendChild(tr);
      });
    }

    /* ---- service health (Domain: Shared) ---- */
    var SERVICES=[
      {name:'Inventory Service',url:'/api/inventory/health'},
      {name:'Tank Monitor',url:'/api/tanks/health'},
      {name:'Order Service',url:'/api/orders/health'},
      {name:'MongoDB',url:null},
      {name:'RabbitMQ',url:null}
    ];

    function fetchHealth(url){
      return fetch(url,{signal:AbortSignal.timeout(3000)})
        .then(function(response){
          if(!response.ok){
            return Promise.reject(new Error('HTTP '+response.status));
          }
          return {ok:true,status:response.status};
        })
        .catch(function(err){
          return {ok:false,status:err && err.message ? err.message : 'unreachable'};
        });
    }

    function applyOperationalState(details){
      PORTAL_STATE=Object.assign({}, PORTAL_STATE, details);
      if(details.healthy){
        setPortalBanner('healthy', details.message || 'Live operational data is current.', details.lastUpdated);
      }else{
        setPortalBanner('degraded', details.message || 'Customer-facing data may be temporarily delayed while the propane platform reconnects.', details.lastUpdated);
      }
    }

    function loadHealth(){
      var c=document.getElementById('health-cards');
      c.innerHTML='';
      Promise.all([
        fetchHealth('/api/inventory/health'),
        fetchHealth('/api/tanks/health'),
        fetchHealth('/api/orders/health')
      ]).then(function(results){
        var inventory=results[0];
        var tank=results[1];
        var orders=results[2];
        var state = PortalHealthState.derivePortalState({
          inventory: inventory,
          tank: tank,
          orders: orders,
          updatedAt: new Date().toISOString()
        }, 'customer', 30000);
        var healthy = !state.degraded;
        var detail = state.message;
        applyOperationalState({ healthy: healthy, message: detail, lastUpdated: state.lastUpdated });
        var serviceRows=[
          {name:'Inventory Service',ok:inventory.ok,status:'Healthy',detail:inventory.ok ? 'Inventory service responding normally.' : 'HTTP ' + inventory.status},
          {name:'Tank Monitor',ok:tank.ok,status:'Healthy',detail:tank.ok ? 'Tank telemetry stream is online.' : 'HTTP ' + tank.status},
          {name:'Order Service',ok:orders.ok,status:'Healthy',detail:orders.ok ? 'Order flow is matching demand.' : 'HTTP ' + orders.status},
          {name:'MongoDB',ok:!state.services.mongodb.degraded,status:'Healthy',detail:state.services.mongodb.degraded ? 'Dependency issue detected; data refresh is delayed.' : 'MongoDB dependency is healthy.'},
          {name:'RabbitMQ',ok:!state.services.rabbitmq.degraded,status:'Healthy',detail:state.services.rabbitmq.degraded ? 'Dependency issue detected; event flow is degraded.' : 'RabbitMQ dependency is healthy.'}
        ];
        serviceRows.forEach(function(svc){
          var card=document.createElement('div');
          card.className='card';
          var color=svc.ok?'var(--green)':'var(--amber)';
          var icon=svc.ok?'green':'amber';
          if(!svc.ok && (svc.name==='MongoDB' || svc.name==='RabbitMQ')){
            color='var(--red)';
            icon='red';
          }
          card.innerHTML='<h3>'+svc.name+'</h3><div style="font-size:1.1rem;font-weight:600;color:'+color+'"><span class="dot '+icon+'"></span> '+(svc.ok?'Healthy':'Degraded')+'</div>' +
            '<div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">'+svc.detail+'</div>';
          c.appendChild(card);
        });
      }).catch(function(){
        applyOperationalState({ healthy: false, message: 'Customer-safe status: some operational data is temporarily delayed while the propane platform reconnects.', lastUpdated: new Date().toISOString() });
        var serviceRows=[
          {name:'Inventory Service',ok:false,status:'Degraded',detail:'Service check failed'},
          {name:'Tank Monitor',ok:false,status:'Degraded',detail:'Service check failed'},
          {name:'Order Service',ok:false,status:'Degraded',detail:'Service check failed'},
          {name:'MongoDB',ok:false,status:'Degraded',detail:'Dependency status uncertain; data view is stale'},
          {name:'RabbitMQ',ok:false,status:'Degraded',detail:'Dependency status uncertain; event queue is disrupted'}
        ];
        serviceRows.forEach(function(svc){
          var card=document.createElement('div');card.className='card';
          card.innerHTML='<h3>'+svc.name+'</h3><div style="font-size:1.1rem;font-weight:600;color:var(--red)"><span class="dot red"></span> Degraded</div><div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">'+svc.detail+'</div>';
          c.appendChild(card);
        });
      });
    }

    /* ---- init (Domain: Shared) ---- */
    updateClock();
    setPortalBanner('healthy','Live operational data is current.', new Date().toISOString());
    updateMetrics();
    loadLocations();
    loadUsage();
    loadHealth();
    setInterval(updateClock,1000);
    setInterval(updateMetrics,5000);
    setInterval(loadLocations,10000);
    setInterval(loadUsage,30000);
    setInterval(loadHealth,30000);
    </script>
    </body>
    </html>


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-portal-nginx
  namespace: propane
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;

        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
        location = /api/inventory/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://inventory-service.propane.svc.cluster.local:3002/health;
        }
        location = /api/tanks/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tank-monitor.propane.svc.cluster.local:3000/health;
        }
        location = /api/orders/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://order-service.propane.svc.cluster.local:3001/health;
        }
        location /api/ {
            return 404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: propane
  labels:
    app: customer-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-portal
  template:
    metadata:
      labels:
        app: customer-portal
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: customer-portal
          image: nginx:alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: customer-portal-html
        - name: nginx-conf
          configMap:
            name: customer-portal-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: propane
spec:
  type: LoadBalancer
  selector:
    app: customer-portal
  ports:
    - port: 80
      targetPort: 8080

---
# =============================================================================
# Dispatch Console - Retail Cage Operations Center (nginx serving custom HTML)
# Domain: Cylinder Exchange — cage grid, cylinder counts, delivery/restock
# queue, and demand forecast for retail cylinder exchange cage locations.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-console-html
  namespace: propane
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmeriGas Retail Cage Operations Center</title>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --accent: #a78bfa; --green: #34d399; --amber: #fbbf24; --red: #f87171; --cyan: #22d3ee; --text: #e2e8f0; --muted: #94a3b8; --blue: #003DA5; --orange: #FF6900; --empty: #334155; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      header { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); border-bottom: 2px solid var(--accent); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
      header h1 { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; gap: .6rem; }
      .status-bar { display: flex; gap: 1.5rem; font-size: .85rem; }
      .status-bar .item { display: flex; align-items: center; gap: .4rem; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
      .dot.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
      .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
      main { padding: 1.5rem 2rem; }
      .metrics-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
      @media (max-width: 1200px) { .metrics-row { grid-template-columns: repeat(3, 1fr); } }
      @media (max-width: 700px) { .metrics-row { grid-template-columns: repeat(2, 1fr); } }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.2rem; margin-bottom: 1.5rem; }
      .cage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-bottom: 1.5rem; }
      @media (max-width: 1100px) { .cage-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 700px) { .cage-grid { grid-template-columns: 1fr; } }
      .card { background: var(--card); border-radius: 10px; padding: 1.2rem; border: 1px solid #334155; }
      .card h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .8rem; }
      .metric { font-size: 2rem; font-weight: 700; }
      .metric sub { font-size: .7rem; font-weight: 400; color: var(--muted); }
      .metric-card { background: rgba(15,23,42,0.85); border: 1px solid rgba(148,163,184,0.2); border-radius: 8px; padding: .8rem .85rem; }
      .metric-label { font-size: .7rem; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: .35rem; }
      .metric-value { font-size: 1.35rem; font-weight: 700; }
      .queue-detail-row { margin-top: .75rem; color: var(--muted); font-size: .82rem; line-height: 1.6; }
      .dlq-list { margin-top: .35rem; padding-left: 1.25rem; }
      .section-title { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 .8rem; color: var(--accent); border-bottom: 1px solid #334155; padding-bottom: .4rem; }
      .legend { display: flex; gap: 1.5rem; font-size: .8rem; color: var(--muted); margin-bottom: 1rem; }
      .legend span { display: flex; align-items: center; gap: .3rem; }
      .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
      .cylinder-grid { display: grid; grid-template-columns: repeat(5, 18px); grid-template-rows: repeat(4, 18px); gap: 4px; margin: .6rem 0; }
      .cylinder { width: 18px; height: 18px; border-radius: 50%; }
      .cylinder.full { background: var(--blue); box-shadow: 0 0 4px rgba(0,61,165,0.5); }
      .cylinder.empty { background: var(--empty); }
      .cylinder.transit { background: var(--orange); box-shadow: 0 0 4px rgba(255,105,0,0.4); }
      .cage-card { background: var(--card); border-radius: 10px; padding: 1rem; border: 1px solid #334155; }
      .cage-card .loc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem; }
      .cage-card .loc-name { font-weight: 600; font-size: .95rem; }
      .region-badge { padding: .1rem .45rem; border-radius: 4px; font-size: .65rem; font-weight: 600; background: #1e1b4b; color: var(--accent); }
      .cage-card .summary { font-size: .78rem; color: var(--muted); margin: .3rem 0; }
      .cage-card .detail-row { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-top: .3rem; }
      .status-badge { padding: .15rem .5rem; border-radius: 4px; font-size: .72rem; font-weight: 600; display: inline-block; margin-top: .3rem; }
      .status-badge.stocked { background: #064e3b; color: var(--green); }
      .status-badge.low { background: #78350f; color: var(--amber); }
      .status-badge.critical { background: #7f1d1d; color: var(--red); }
      .status-badge.restock { background: #1e1b4b; color: var(--accent); }
      @keyframes pulse-border { 0%,100% { border-color: var(--red); } 50% { border-color: transparent; } }
      .cage-card.critical-loc { border: 2px solid var(--red); animation: pulse-border 1.5s infinite; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: .6rem .8rem; text-align: left; border-bottom: 1px solid #334155; font-size: .85rem; }
      th { color: var(--muted); text-transform: uppercase; font-size: .75rem; letter-spacing: .06em; }
      .badge { padding: .15rem .5rem; border-radius: 4px; font-size: .75rem; font-weight: 600; }
      .badge.online { background: #064e3b; color: var(--green); }
      .badge.offline { background: #7f1d1d; color: var(--red); }
      .badge.warning { background: #78350f; color: var(--amber); }
      .badge.processing { background: #1e1b4b; color: var(--accent); }
      .alarm-card { background: linear-gradient(180deg, rgba(17,24,39,0.98), rgba(30,41,59,0.98)); border: 1px solid rgba(251,191,36,0.5); border-radius: 12px; padding: 1rem 1.1rem; box-shadow: inset 0 0 0 1px rgba(251,191,36,0.08); }
      .alarm-card.pending { border-color: rgba(251,191,36,0.7); }
      .alarm-card.acknowledged { border-color: rgba(45,212,191,0.7); }
      .alarm-card.recovered { border-color: rgba(52,211,153,0.7); }
      .alarm-alert { font-size: .8rem; color: var(--amber); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .alarm-header { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .7rem; }
      .alarm-title { font-size: 1.05rem; font-weight: 700; }
      .alarm-chip { border-radius: 999px; padding: .2rem .65rem; font-size: .72rem; font-weight: 700; text-transform: uppercase; }
      .alarm-chip.pending { background: rgba(251,191,36,0.16); color: var(--amber); }
      .alarm-chip.acknowledged { background: rgba(45,212,191,0.14); color: var(--cyan); }
      .alarm-chip.recovered { background: rgba(52,211,153,0.14); color: var(--green); }
      .alarm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .8rem; margin: .75rem 0 1rem; }
      .alarm-metric { background: rgba(15,23,42,0.7); border: 1px solid rgba(148,163,184,0.25); border-radius: 8px; padding: .7rem .8rem; }
      .alarm-metric .label { display: block; font-size: .72rem; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: .25rem; }
      .alarm-metric .value { font-weight: 700; }
      .alarm-note { font-size: .8rem; color: var(--muted); line-height: 1.6; }
      .alarm-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: .9rem; }
      .alarm-actions button { border: none; border-radius: 8px; padding: .7rem 1rem; font-weight: 700; cursor: pointer; color: var(--bg); background: linear-gradient(135deg, var(--amber), #f59e0b); }
      .alarm-actions button.secondary { background: transparent; border: 1px solid rgba(148,163,184,0.5); color: var(--text); }
      .footer { text-align: center; padding: 2rem; color: var(--muted); font-size: .75rem; }
      .log-box { background: #0d1117; border: 1px solid #334155; border-radius: 8px; padding: 1rem; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: .8rem; max-height: 220px; overflow-y: auto; line-height: 1.6; }
      .log-box .ts { color: var(--muted); }
      .log-box .info { color: var(--cyan); }
      .log-box .warn { color: var(--amber); }
      .log-box .err { color: var(--red); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
      .loading { animation: pulse 1.5s infinite; color: var(--muted); }
      .demand-high { color: var(--red); font-weight: 600; }
      .demand-normal { color: var(--green); }
      .demand-low { color: var(--cyan); }
    </style>
    </head>
    <body>
    <header>
      <h1>&#9881;&#65039; AmeriGas &mdash; Retail Cage Operations Center</h1>
      <div class="status-bar">
        <div class="item"><span class="dot green"></span> Dispatcher Mode</div>
        <div class="item">Cylinder Exchange Domain</div>
        <div class="item" id="clock"></div>
      </div>
    </header>
    <main>
      <!-- Domain: Cylinder Exchange -->
      <div id="dispatch-banner" style="display:none;margin:0 0 1rem;padding:.8rem 1rem;border-radius:10px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.12);color:var(--green);font-size:.85rem;line-height:1.4;"></div>
      <div class="metrics-row">
        <div class="card"><h3>Total Retail Locations</h3><div class="metric" style="color:var(--accent)" id="m-locations">--</div></div>
        <div class="card"><h3>Cylinders in Field</h3><div class="metric" style="color:var(--cyan)" id="m-cylinders">--</div></div>
        <div class="card"><h3>Avg Fill Rate</h3><div class="metric" style="color:var(--green)" id="m-fill">--<sub> %</sub></div></div>
        <div class="card"><h3>Critical Locations</h3><div class="metric" style="color:var(--red)" id="m-critical">--</div></div>
        <div class="card"><h3>Deliveries Today</h3><div class="metric" style="color:var(--amber)" id="m-deliveries">--</div></div>
        <div class="card"><h3>Tomorrow Forecast</h3><div class="metric" style="font-size:1.3rem" id="m-forecast">--</div></div>
      </div>

      <h2 class="section-title">&#128269; Bulk Tank Refill Order Backlog</h2>
      <div class="card" id="refill-order-backlog" style="overflow-x:auto"></div>

      <!-- Domain: Shared -->
      <h2 class="section-title">&#128200; Order Fulfillment Latency</h2>
      <div class="card" id="order-dependency-latency" style="overflow-x:auto"></div>

      <h2 class="section-title">&#127978; Retail Cage Inventory Monitor</h2>
      <div class="legend">
        <span><span class="legend-dot" style="background:var(--blue)"></span> Full</span>
        <span><span class="legend-dot" style="background:var(--empty)"></span> Empty</span>
        <span><span class="legend-dot" style="background:var(--orange)"></span> In-Transit</span>
      </div>
      <div class="cage-grid" id="cage-grid"></div>

      <h2 class="section-title">&#128197; Delivery Schedule &amp; Priority Queue</h2>
      <div class="card" style="overflow-x:auto">
        <table>
          <thead><tr><th>Location</th><th>Full / Total</th><th>Empty</th><th>Daily Turnover</th><th>Est. Stockout</th><th>Priority</th><th>Scheduled Delivery</th></tr></thead>
          <tbody id="delivery-body"></tbody>
        </table>
      </div>

      <h2 class="section-title">&#127777;&#65039; Demand Forecast</h2>
      <div class="card" style="overflow-x:auto">
        <table>
          <thead><tr><th>Day</th><th>High Temp (&deg;F)</th><th>Demand Level</th><th>Est. Cylinders Needed</th><th>Notes</th></tr></thead>
          <tbody id="forecast-body"></tbody>
        </table>
      </div>

      <!-- Domain: Bulk Tank -->
      <h2 class="section-title">&#9888;&#65039; Bulk Tank Safety Alarm</h2>
      <div class="alarm-card pending" id="bulk-tank-safety-alarm"></div>
      <div class="alarm-actions">
        <button type="button" onclick="acknowledgeBulkTankSafetyAlarm()">Acknowledge alarm</button>
        <button type="button" class="secondary" onclick="processBulkTankSafetyAlarm()">Process pending alarm</button>
      </div>

      <h2 class="section-title">&#128223; Operations Log</h2>
      <div class="log-box" id="ops-log"></div>

      <h2 class="section-title">&#128295; Platform Health</h2>
      <div class="grid" id="health-grid"></div>
    </main>
    <div class="footer">AmeriGas &mdash; Retail Cage Operations Center &mdash; Azure SRE Agent Demo Lab</div>

    <script>
    // Domain: Cylinder Exchange
    const LOCATIONS = [
      { name: 'Home Depot KoP', region: 'PA-East' },
      { name: 'Walmart Collegeville', region: 'PA-East' },
      { name: "Lowe's Exton", region: 'PA-East' },
      { name: 'ACE Lansdale', region: 'PA-East' },
      { name: 'Wawa Wayne', region: 'PA-East' },
      { name: 'ShopRite Norristown', region: 'PA-East' },
      { name: 'Giant Pottstown', region: 'PA-Central' },
      { name: 'Costco Plymouth Meeting', region: 'PA-East' },
      { name: 'Home Depot Allentown', region: 'PA-Central' },
      { name: "BJ's Whitehall", region: 'PA-Central' },
      { name: 'Tractor Supply Quakertown', region: 'PA-Central' },
      { name: 'Walmart Easton', region: 'PA-Central' },
    ];

    const DELIVERY_TIMES = ['Tomorrow 6AM', 'Tomorrow 2PM', 'Thu 8AM', 'Thu 2PM', 'Fri 6AM', 'Fri 10AM', 'Sat 7AM', 'None Scheduled'];
    const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const FORECAST_NOTES = [
      'Cold snap expected', 'Steady demand', 'Weekend BBQ season boost',
      'Mild temperatures', 'Storm front approaching', 'Holiday weekend surge',
      'Below-average temps forecast', 'Seasonal transition period',
      'Post-storm recovery demand', 'Normal consumption pattern',
    ];

    let locationData = [];
    let LAST_KNOWN_LOCATION_DATA = [];
    let DISPATCH_STATE = { healthy: true, message: 'Live dispatch telemetry is current.', lastUpdated: new Date().toISOString() };
    // Domain: Shared
    const PortalHealthState = (typeof window !== 'undefined' && window.PortalHealthState) || (function () {
      function normalizeServiceState(service) {
        if (!service) return { ok: true, code: 'unknown', degraded: false, name: 'Service' };
        if (typeof service.ok === 'boolean') {
          return { ok: service.ok, code: service.code || service.status || (service.ok ? 200 : 500), degraded: !service.ok, name: service.name || 'Service' };
        }
        var numericStatus = Number(service.status || service.code || 0);
        var ok = service.status === undefined && service.code === undefined ? true : numericStatus >= 200 && numericStatus < 500;
        return { ok: ok, code: numericStatus || 'unknown', degraded: !ok, name: service.name || 'Service' };
      }
      function isStale(updatedAt, staleAfterMs) {
        if (!updatedAt) return false;
        var timestamp = new Date(updatedAt).getTime();
        if (Number.isNaN(timestamp)) return false;
        return Date.now() - timestamp > (staleAfterMs || 30000);
      }
      function derivePortalState(serviceResults, portalName, staleAfterMs) {
        var serviceResultsSafe = serviceResults || {};
        var results = {
          inventory: normalizeServiceState(serviceResultsSafe.inventory),
          tank: normalizeServiceState(serviceResultsSafe.tank),
          orders: normalizeServiceState(serviceResultsSafe.orders),
          mongodb: serviceResultsSafe.mongodb ? normalizeServiceState(serviceResultsSafe.mongodb) : { ok: true, code: 200, degraded: false, name: 'MongoDB' },
          rabbitmq: serviceResultsSafe.rabbitmq ? normalizeServiceState(serviceResultsSafe.rabbitmq) : { ok: true, code: 200, degraded: false, name: 'RabbitMQ' }
        };
        var derivedMongoOk = results.inventory.ok && results.orders.ok && !results.mongodb.degraded;
        var derivedRabbitOk = results.tank.ok && results.orders.ok && !results.rabbitmq.degraded;
        results.mongodb = Object.assign({}, results.mongodb, { ok: derivedMongoOk, degraded: !derivedMongoOk, code: derivedMongoOk ? 200 : 503 });
        results.rabbitmq = Object.assign({}, results.rabbitmq, { ok: derivedRabbitOk, degraded: !derivedRabbitOk, code: derivedRabbitOk ? 200 : 503 });
        var relevantKeys = portalName === 'customer' ? ['inventory', 'tank', 'mongodb', 'rabbitmq'] : ['orders', 'mongodb', 'rabbitmq', 'tank'];
        var lastUpdated = serviceResults && serviceResults.updatedAt ? serviceResults.updatedAt : new Date().toISOString();
        var stale = isStale(lastUpdated, staleAfterMs);
        var degraded = relevantKeys.some(function (key) { return results[key].degraded; }) || stale;
        var status = degraded ? 'degraded' : 'healthy';
        var state = { status: status, degraded: degraded, stale: stale, lastUpdated: lastUpdated, message: degraded ? 'Customer-facing data is temporarily delayed while the propane platform reconnects.' : 'Live operational data is current.', services: results };
        if (portalName === 'dispatch') {
          state.message = degraded ? 'Operations data is temporarily delayed while the dispatch pipeline recovers.' : 'Live dispatch telemetry is current.';
        }
        return state;
      }
      return { normalizeServiceState: normalizeServiceState, isStale: isStale, derivePortalState: derivePortalState };
    }());
    if (typeof window !== 'undefined') { window.PortalHealthState = PortalHealthState; }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function randF(min, max) { return +(min + Math.random() * (max - min)).toFixed(1); }

    function setDispatchBanner(status, message, timestamp) {
      const banner = document.getElementById('dispatch-banner');
      if (!banner) return;
      banner.style.display = 'block';
      banner.style.background = status === 'healthy' ? 'rgba(34,197,94,0.12)' : 'rgba(245,158,11,0.14)';
      banner.style.border = status === 'healthy' ? '1px solid rgba(34,197,94,0.3)' : '1px solid rgba(245,158,11,0.35)';
      banner.style.color = status === 'healthy' ? 'var(--green)' : 'var(--amber)';
      banner.innerHTML = '<strong>' + (status === 'healthy' ? 'All dispatch systems normal' : 'Platform visibility is temporarily degraded') + '.</strong> ' + message + (timestamp ? ' Last updated ' + new Date(timestamp).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) + '.' : '');
    }

    function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }

    // Domain: Cylinder Exchange
    function generateLocationData() {
      const next = LOCATIONS.map(loc => {
        const full = rand(2, 18);
        const transit = rand(0, 3);
        const empty = 20 - full - transit;
        const turnover = randF(1.5, 5.0);
        const stockoutHrs = full > 0 ? +(full / (turnover / 24)).toFixed(1) : 0;
        const nextDelivery = (full <= 6 && transit > 0) ? DELIVERY_TIMES[rand(0, 5)] :
                              full <= 10 ? DELIVERY_TIMES[rand(0, 6)] : DELIVERY_TIMES[rand(5, 7)];
        return { ...loc, full, empty, transit, turnover, stockoutHrs, nextDelivery };
      });
      LAST_KNOWN_LOCATION_DATA = next;
      locationData = next;
      return next;
    }

    function updateMetrics() {
      const source = DISPATCH_STATE.healthy ? locationData : (LAST_KNOWN_LOCATION_DATA.length ? LAST_KNOWN_LOCATION_DATA : locationData);
      const totalLocs = source.length ? source.length : rand(42, 48);
      const totalCylinders = source.reduce((sum, loc) => sum + loc.full + loc.transit, 0) || rand(680, 720);
      const critCount = source.filter(l => l.full <= 3).length || rand(2, 6);
      const avgFill = source.length ? (source.reduce((s, l) => s + l.full, 0) / (source.length * 20) * 100).toFixed(1) : randF(65, 85);
      const deliveries = rand(8, 18);
      const temps = [28, 35, 42, 55, 62, 70, 78];
      const tomorrowTemp = temps[rand(0, temps.length - 1)];
      const forecast = tomorrowTemp <= 35 ? 'High Demand' : tomorrowTemp <= 55 ? 'Normal' : 'Light';
      const fColor = forecast === 'High Demand' ? 'var(--red)' : forecast === 'Normal' ? 'var(--green)' : 'var(--cyan)';

      document.getElementById('m-locations').textContent = totalLocs;
      document.getElementById('m-cylinders').textContent = totalCylinders;
      document.getElementById('m-fill').innerHTML = avgFill + '<sub> %</sub>';
      document.getElementById('m-critical').textContent = critCount;
      document.getElementById('m-deliveries').textContent = deliveries;
      document.getElementById('m-forecast').innerHTML = '<span style="color:' + fColor + '">' + forecast + '</span>';
    }

    function renderCageGrid() {
      const container = document.getElementById('cage-grid');
      container.innerHTML = '';
      const data = DISPATCH_STATE.healthy ? locationData : (LAST_KNOWN_LOCATION_DATA.length ? LAST_KNOWN_LOCATION_DATA : locationData);
      data.forEach(loc => {
        const card = document.createElement('div');
        const isCritical = loc.full <= 3;
        card.className = 'cage-card' + (isCritical ? ' critical-loc' : '');

        let statusBadge, statusClass;
        if (loc.full > 10) { statusBadge = '&#9989; Stocked'; statusClass = 'stocked'; }
        else if (loc.full >= 4) { statusBadge = '&#9888;&#65039; Low Stock'; statusClass = 'low'; }
        else if (loc.transit > 0 && loc.full <= 6) { statusBadge = '&#128230; Restock Scheduled'; statusClass = 'restock'; }
        else { statusBadge = '&#128308; Critical'; statusClass = 'critical'; }

        let cylinders = '';
        let idx = 0;
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 5; c++) {
            let cls = 'cylinder ';
            if (idx < loc.full) cls += 'full';
            else if (idx < loc.full + loc.transit) cls += 'transit';
            else cls += 'empty';
            cylinders += '<div class="' + cls + '"></div>';
            idx++;
          }
        }

        card.innerHTML =
          '<div class="loc-header"><span class="loc-name">' + loc.name + '</span><span class="region-badge">' + loc.region + '</span></div>' +
          '<div class="cylinder-grid">' + cylinders + '</div>' +
          '<div class="summary">' + loc.full + ' Full | ' + loc.empty + ' Empty | ' + loc.transit + ' In-Transit</div>' +
          '<span class="status-badge ' + statusClass + '">' + statusBadge + '</span>' +
          '<div class="detail-row"><span>Next: ' + loc.nextDelivery + '</span><span>~' + loc.turnover + ' cylinders/day</span></div>';
        container.appendChild(card);
      });
    }

    function renderDeliveryQueue() {
      const tbody = document.getElementById('delivery-body');
      tbody.innerHTML = '';
      const data = DISPATCH_STATE.healthy ? locationData : (LAST_KNOWN_LOCATION_DATA.length ? LAST_KNOWN_LOCATION_DATA : locationData);
      const sorted = [...data].sort((a, b) => a.stockoutHrs - b.stockoutHrs).slice(0, 10);
      sorted.forEach(loc => {
        let prioLabel, prioClass;
        if (loc.stockoutHrs < 12) { prioLabel = 'URGENT'; prioClass = 'offline'; }
        else if (loc.stockoutHrs < 24) { prioLabel = 'HIGH'; prioClass = 'warning'; }
        else { prioLabel = 'NORMAL'; prioClass = 'online'; }
        const schedHtml = loc.nextDelivery === 'None Scheduled'
          ? '<span style="color:var(--red);font-weight:600">UNSCHEDULED</span>'
          : loc.nextDelivery;
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + loc.name + '</td>' +
          '<td>' + loc.full + ' / 20</td>' +
          '<td>' + loc.empty + '</td>' +
          '<td>~' + loc.turnover + '/day</td>' +
          '<td>' + loc.stockoutHrs + 'h</td>' +
          '<td><span class="badge ' + prioClass + '">' + prioLabel + '</span></td>' +
          '<td>' + schedHtml + '</td>';
        tbody.appendChild(tr);
      });
    }

    function renderForecast() {
      const tbody = document.getElementById('forecast-body');
      tbody.innerHTML = '';
      DAYS.forEach((day, i) => {
        const temp = rand(22, 82);
        let level, levelClass;
        if (temp <= 35) { level = 'High'; levelClass = 'demand-high'; }
        else if (temp <= 60) { level = 'Normal'; levelClass = 'demand-normal'; }
        else { level = 'Low'; levelClass = 'demand-low'; }
        const est = level === 'High' ? rand(50, 80) : level === 'Normal' ? rand(25, 50) : rand(10, 25);
        const note = FORECAST_NOTES[rand(0, FORECAST_NOTES.length - 1)];
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + day + '</td>' +
          '<td>' + temp + '&deg;F</td>' +
          '<td><span class="' + levelClass + '">' + level + '</span></td>' +
          '<td>' + est + '</td>' +
          '<td style="color:var(--muted);font-size:.8rem">' + note + '</td>';
        tbody.appendChild(tr);
      });
    }

    // Domain: Shared
    const REFILL_ORDER_BACKLOG = {
      queueName: 'refill-orders',
      deadLetterQueueName: 'refill-orders-dlq',
      producerHealthy: true,
      consumerPaused: true,
      queueDepth: 14,
      oldestMessageAgeSeconds: 420,
      activeConsumerCount: 0,
      affectedOrderIds: ['RO-1041', 'RO-1042', 'RO-1043', 'RO-1044'],
      affectedEventIds: ['EV-REFILL-1041', 'EV-REFILL-1042', 'EV-REFILL-1043', 'EV-REFILL-1044', 'EV-REFILL-2047'],
      malformedEventId: 'EV-REFILL-2047',
      malformedOrderId: 'RO-2047',
      maxRetryCount: 3,
      retryCount: 3,
      deadLetterQueue: [
        {
          eventId: 'EV-REFILL-2047',
          orderId: 'RO-2047',
          reason: 'Malformed refill-order payload',
          retries: 3
        }
      ],
      validOrdersDrained: 0,
      recoveredOrderIds: [],
      recoveryComplete: false,
      status: 'paused',
      lastUpdatedAt: '2025-02-11T07:02:42Z'
    };

    const REFILL_ORDER_BACKLOG_STATE = REFILL_ORDER_BACKLOG;

    function appendRefillOrderLog(level, message) {
      const box = document.getElementById('ops-log');
      if (!box) return;
      const ts = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.innerHTML = '<span class="ts">[' + ts + ']</span> <span class="' + level + '">[' + level.toUpperCase() + ']</span> ' + message;
      box.prepend(line);
      if (box.children.length > 50) box.removeChild(box.lastChild);
    }

    function renderRefillOrderBacklog() {
      const panel = document.getElementById('refill-order-backlog');
      if (!panel) return;

      const backlog = REFILL_ORDER_BACKLOG;
      const queueAgeMinutes = Math.max(0, Math.floor(backlog.oldestMessageAgeSeconds / 60));
      const dlqHtml = backlog.deadLetterQueue.length
        ? backlog.deadLetterQueue.map((entry) => '<li>' + entry.eventId + ' → ' + entry.orderId + ' (' + entry.reason + '; retries=' + entry.retries + ')</li>').join('')
        : '<li>None</li>';

      panel.innerHTML =
        '<div class="metric-grid">' +
        '  <div class="metric-card"><div class="metric-label">Queue depth</div><div class="metric-value">' + backlog.queueDepth + '</div></div>' +
        '  <div class="metric-card"><div class="metric-label">Oldest message</div><div class="metric-value">' + queueAgeMinutes + ' min</div></div>' +
        '  <div class="metric-card"><div class="metric-label">Active consumers</div><div class="metric-value">' + backlog.activeConsumerCount + '</div></div>' +
        '  <div class="metric-card"><div class="metric-label">Retry limit</div><div class="metric-value">' + backlog.retryCount + '/' + backlog.maxRetryCount + '</div></div>' +
        '</div>' +
        '<div class="queue-detail-row"><strong>Queue:</strong> ' + backlog.queueName + ' <strong>DLQ:</strong> ' + backlog.deadLetterQueueName + ' <strong>Status:</strong> ' + (backlog.consumerPaused ? 'Paused consumer' : 'Recovered') + '</div>' +
        '<div class="queue-detail-row"><strong>Affected refill orders:</strong> ' + backlog.affectedOrderIds.join(', ') + '</div>' +
        '<div class="queue-detail-row"><strong>DLQ contents:</strong><ul class="dlq-list">' + dlqHtml + '</ul></div>';
    }

    function pauseRefillOrderConsumer() {
      REFILL_ORDER_BACKLOG.consumerPaused = true;
      REFILL_ORDER_BACKLOG.producerHealthy = true;
      REFILL_ORDER_BACKLOG.activeConsumerCount = 0;
      REFILL_ORDER_BACKLOG.status = 'paused';
      REFILL_ORDER_BACKLOG.lastUpdatedAt = new Date().toISOString();
      appendRefillOrderLog('warn', 'RabbitMQ refill-orders queue is growing while the consumer remains paused. Producer health remains healthy.');
      renderRefillOrderBacklog();
      return REFILL_ORDER_BACKLOG;
    }

    function advanceRefillOrderBacklog() {
      if (!REFILL_ORDER_BACKLOG.consumerPaused) {
        return REFILL_ORDER_BACKLOG;
      }

      REFILL_ORDER_BACKLOG.queueDepth += 2;
      REFILL_ORDER_BACKLOG.oldestMessageAgeSeconds += 30;
      REFILL_ORDER_BACKLOG.lastUpdatedAt = new Date().toISOString();
      REFILL_ORDER_BACKLOG.status = 'queue-growing';
      renderRefillOrderBacklog();
      return REFILL_ORDER_BACKLOG;
    }

    function processPoisonRefillOrder() {
      const retryLimit = REFILL_ORDER_BACKLOG.maxRetryCount;
      REFILL_ORDER_BACKLOG.retryCount = Math.min((REFILL_ORDER_BACKLOG.retryCount || 0) + 1, retryLimit);
      REFILL_ORDER_BACKLOG.status = REFILL_ORDER_BACKLOG.retryCount >= retryLimit ? 'dead-lettered' : 'retrying';
      REFILL_ORDER_BACKLOG.lastUpdatedAt = new Date().toISOString();

      if (REFILL_ORDER_BACKLOG.retryCount >= retryLimit) {
        const record = {
          eventId: REFILL_ORDER_BACKLOG.malformedEventId,
          orderId: REFILL_ORDER_BACKLOG.malformedOrderId,
          reason: 'Malformed refill-order payload',
          retries: retryLimit
        };

        if (!REFILL_ORDER_BACKLOG.deadLetterQueue.some((entry) => entry.eventId === record.eventId)) {
          REFILL_ORDER_BACKLOG.deadLetterQueue.push(record);
        }

        appendRefillOrderLog('err', 'Malformed refill event ' + record.eventId + ' exceeded retry limit ' + retryLimit + ' and moved to ' + REFILL_ORDER_BACKLOG.deadLetterQueueName + '.');
      } else {
        appendRefillOrderLog('warn', 'Malformed refill event ' + REFILL_ORDER_BACKLOG.malformedEventId + ' retry ' + REFILL_ORDER_BACKLOG.retryCount + '/' + retryLimit + '.');
      }

      renderRefillOrderBacklog();
      return REFILL_ORDER_BACKLOG.status;
    }

    function recoverRefillOrderBacklog() {
      const recovered = [];
      const alreadyRecovered = new Set(REFILL_ORDER_BACKLOG.recoveredOrderIds);

      for (const orderId of REFILL_ORDER_BACKLOG.affectedOrderIds) {
        if (alreadyRecovered.has(orderId)) continue;
        recovered.push(orderId);
        REFILL_ORDER_BACKLOG.recoveredOrderIds.push(orderId);
      }

      if (recovered.length > 0) {
        REFILL_ORDER_BACKLOG.validOrdersDrained += recovered.length;
        REFILL_ORDER_BACKLOG.queueDepth = Math.max(0, REFILL_ORDER_BACKLOG.queueDepth - recovered.length);
      }

      REFILL_ORDER_BACKLOG.consumerPaused = false;
      REFILL_ORDER_BACKLOG.activeConsumerCount = 2;
      REFILL_ORDER_BACKLOG.recoveryComplete = true;
      REFILL_ORDER_BACKLOG.status = 'recovered';
      REFILL_ORDER_BACKLOG.lastUpdatedAt = new Date().toISOString();
      appendRefillOrderLog('info', 'Recovery drained valid refill orders exactly once: ' + recovered.join(', ') + '. DLQ evidence retained for forensic review.');
      renderRefillOrderBacklog();
      return recovered;
    }

    // Domain: Shared
    // Business-impact illustration for the dependency-latency scenario
    // (issue #22). Mirrors the same static-illustrative-state-plus-testable-
    // functions pattern used by REFILL_ORDER_BACKLOG above: values here
    // match the order-pricing-dependency-config ConfigMap defaults/overrides
    // in k8s/base/application.yaml and k8s/scenarios/dependency-latency.yaml
    // so docs/tests can cross-reference exact numbers. The authoritative,
    // live-measured evidence for this scenario is the in-cluster
    // order-pricing-dependency / order-checkout-probe pods' logs, /metrics,
    // and OTLP export — this panel narrates the same incident for the demo
    // walkthrough, the same way REFILL_ORDER_BACKLOG does above.
    const ORDER_DEPENDENCY_LATENCY = {
      dependencyName: 'pricing-lookup',
      impactedTransaction: 'order.checkout',
      sloP95ThresholdMs: 500,
      errorRateCeilingPct: 2,
      delayMode: 'fixed',
      baselineP95Ms: 58,
      currentP50Ms: 45,
      currentP95Ms: 58,
      currentP99Ms: 72,
      errorRatePct: 0.2,
      rampFromMs: 45,
      rampToMs: 950,
      rampDurationSeconds: 75,
      configVersion: 'baseline-v1',
      configChangeReason: 'Baseline pricing-lookup timeout configuration. No incident is active.',
      configChangedBy: 'platform-baseline',
      configChangedAt: '2025-01-01T00:00:00Z',
      runId: null,
      status: 'healthy',
      mode: 'baseline',
      lastUpdatedAt: '2025-01-01T00:00:00Z'
    };

    const ORDER_DEPENDENCY_LATENCY_POLL_INTERVAL_MS = 15000;
    const ORDER_DEPENDENCY_LATENCY_STALE_AFTER_MS = 30000;

    function coerceFiniteNumber(rawValue, fallbackValue, minValue, maxValue) {
      const candidate = Number(rawValue);
      if (!Number.isFinite(candidate)) return fallbackValue;
      if (typeof minValue === 'number' && candidate < minValue) return fallbackValue;
      if (typeof maxValue === 'number' && candidate > maxValue) return fallbackValue;
      return candidate;
    }

    function sanitizeOrderDependencyLatencyStatus(payload) {
      if (!payload || typeof payload !== 'object') return null;

      const config = payload.config && typeof payload.config === 'object' ? payload.config : {};
      const modeValue = String(payload.mode || config.mode || payload.delayMode || config.delayMode || '').trim().toLowerCase();
      const mode = ['baseline', 'ramp', 'recovery'].includes(modeValue) ? modeValue : null;
      const metrics = payload.quantilesMs && typeof payload.quantilesMs === 'object' ? payload.quantilesMs : {};
      const p50 = coerceFiniteNumber(payload.p50Ms ?? payload.p50 ?? metrics.p50 ?? config.p50Ms ?? config.p50, 0, 0, 10000);
      const p95 = coerceFiniteNumber(payload.p95Ms ?? payload.p95 ?? metrics.p95 ?? config.p95Ms ?? config.p95, 0, 0, 10000);
      const p99 = coerceFiniteNumber(payload.p99Ms ?? payload.p99 ?? metrics.p99 ?? config.p99Ms ?? config.p99, 0, 0, 10000);
      const errorRate = coerceFiniteNumber(payload.errorRatePct ?? payload.errorRate ?? config.errorRatePct ?? config.errorRate, 0, 0, 100);
      const readinessValue = payload.readiness ?? payload.readyPct ?? config.readiness ?? config.readyPct ?? 1;
      const readinessRaw = Number(readinessValue);
      const readiness = Number.isFinite(readinessRaw) ? (readinessRaw > 1 ? readinessRaw / 100 : readinessRaw) : 1;
      if (!Number.isFinite(readiness) || readiness < 0 || readiness > 1) return null;
      if (!Number.isFinite(p50) || !Number.isFinite(p95) || !Number.isFinite(p99) || p50 < 0 || p95 < 0 || p99 < 0) return null;
      if (p95 < p50 || p99 < p95) return null;
      if (errorRate < 0 || errorRate > 100) return null;

      const runId = String(payload.runId || payload.run_id || config.runId || config.run_id || payload.correlationId || payload.correlation_id || '').trim();
      const configVersion = String(payload.configVersion || payload.config_version || config.configVersion || config.config_version || '').trim();
      const configChangeReason = String(payload.configChangeReason || payload.config_change_reason || config.configChangeReason || config.config_change_reason || 'Live scenario status from order-checkout-probe').trim();
      const configChangedBy = String(payload.configChangedBy || payload.config_changed_by || config.configChangedBy || config.config_changed_by || 'platform-live').trim();
      const lastUpdatedAt = String(payload.lastUpdatedAt || payload.updatedAt || payload.timestamp || config.lastUpdatedAt || config.updatedAt || config.timestamp || new Date().toISOString()).trim();
      const timestamp = new Date(lastUpdatedAt).getTime();
      if (!lastUpdatedAt || Number.isNaN(timestamp)) return null;
      if (!runId || !configVersion) return null;

      const inferredMode = mode || (p95 > ORDER_DEPENDENCY_LATENCY.sloP95ThresholdMs ? 'ramp' : (ORDER_DEPENDENCY_LATENCY.status === 'active' && p95 <= ORDER_DEPENDENCY_LATENCY.sloP95ThresholdMs ? 'recovery' : 'baseline'));
      return {
        mode: inferredMode,
        p50Ms: p50,
        p95Ms: p95,
        p99Ms: p99,
        errorRatePct: errorRate,
        readiness: readiness,
        runId: runId,
        configVersion: configVersion,
        configChangeReason: configChangeReason,
        configChangedBy: configChangedBy,
        configChangedAt: payload.configChangedAt || payload.config_changed_at || config.configChangedAt || config.config_changed_at || lastUpdatedAt,
        lastUpdatedAt: lastUpdatedAt,
        service: payload.service || config.service || 'order-checkout-probe'
      };
    }

    function applyOrderDependencyLatencyStatus(payload) {
      const sanitized = sanitizeOrderDependencyLatencyStatus(payload);
      if (!sanitized) {
        ORDER_DEPENDENCY_LATENCY.status = 'unavailable';
        ORDER_DEPENDENCY_LATENCY.mode = 'baseline';
        ORDER_DEPENDENCY_LATENCY.lastUpdatedAt = new Date().toISOString();
        ORDER_DEPENDENCY_LATENCY.configChangeReason = 'Order dependency latency status is unavailable or malformed.';
        renderOrderDependencyLatency();
        return false;
      }

      const stale = Date.now() - new Date(sanitized.lastUpdatedAt).getTime() > ORDER_DEPENDENCY_LATENCY_STALE_AFTER_MS;
      const derivedStatus = stale ? 'stale' : sanitized.mode === 'ramp' ? 'active' : sanitized.mode === 'recovery' ? 'recovered' : 'healthy';

      ORDER_DEPENDENCY_LATENCY.status = derivedStatus;
      ORDER_DEPENDENCY_LATENCY.mode = sanitized.mode;
      ORDER_DEPENDENCY_LATENCY.currentP50Ms = sanitized.p50Ms;
      ORDER_DEPENDENCY_LATENCY.currentP95Ms = sanitized.p95Ms;
      ORDER_DEPENDENCY_LATENCY.currentP99Ms = sanitized.p99Ms;
      ORDER_DEPENDENCY_LATENCY.errorRatePct = sanitized.errorRatePct;
      ORDER_DEPENDENCY_LATENCY.runId = sanitized.runId;
      ORDER_DEPENDENCY_LATENCY.configVersion = sanitized.configVersion;
      ORDER_DEPENDENCY_LATENCY.configChangeReason = sanitized.configChangeReason;
      ORDER_DEPENDENCY_LATENCY.configChangedBy = sanitized.configChangedBy;
      ORDER_DEPENDENCY_LATENCY.configChangedAt = sanitized.configChangedAt;
      ORDER_DEPENDENCY_LATENCY.lastUpdatedAt = sanitized.lastUpdatedAt;
      renderOrderDependencyLatency();
      return true;
    }

    function fetchOrderDependencyLatencyStatus() {
      if (typeof fetch !== 'function') {
        ORDER_DEPENDENCY_LATENCY.status = 'unavailable';
        ORDER_DEPENDENCY_LATENCY.mode = 'baseline';
        ORDER_DEPENDENCY_LATENCY.lastUpdatedAt = new Date().toISOString();
        renderOrderDependencyLatency();
        return Promise.resolve(false);
      }

      return fetch('/api/orders/latency-status', {
        method: 'GET',
        headers: { Accept: 'application/json' },
        signal: typeof AbortSignal !== 'undefined' && AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined,
      })
        .then(function (response) {
          if (!response || !response.ok) {
            throw new Error('HTTP ' + (response && response.status ? response.status : 'unavailable'));
          }
          return response.json();
        })
        .then(function (payload) {
          const sanitized = sanitizeOrderDependencyLatencyStatus(payload);
          if (!sanitized) {
            throw new Error('Malformed latency status payload');
          }
          return applyOrderDependencyLatencyStatus(sanitized);
        })
        .catch(function (error) {
          ORDER_DEPENDENCY_LATENCY.status = 'unavailable';
          ORDER_DEPENDENCY_LATENCY.mode = 'baseline';
          ORDER_DEPENDENCY_LATENCY.lastUpdatedAt = new Date().toISOString();
          ORDER_DEPENDENCY_LATENCY.configChangeReason = 'Order dependency latency status unavailable: ' + (error && error.message ? error.message : 'unknown error');
          renderOrderDependencyLatency();
          return false;
        });
    }

    function renderOrderDependencyLatency() {
      const panel = document.getElementById('order-dependency-latency');
      if (!panel) return;

      const latency = ORDER_DEPENDENCY_LATENCY;
      const breached = Number(latency.currentP95Ms) > Number(latency.sloP95ThresholdMs);
      const withinErrorCeiling = Number(latency.errorRatePct) <= Number(latency.errorRateCeilingPct);
      const isUnavailable = latency.status === 'unavailable' || latency.status === 'stale';
      const statusLabel = latency.status === 'active'
        ? 'SLO breached — latency-led incident'
        : latency.status === 'recovered'
          ? 'Recovered — below SLO threshold'
          : latency.status === 'stale'
            ? 'Stale — last live status exceeded the freshness window'
            : latency.status === 'unavailable'
              ? 'Unavailable — status endpoint is not returning trusted data'
              : 'Healthy — below SLO threshold';

      panel.textContent = '';

      const metrics = document.createElement('div');
      metrics.className = 'metric-grid';
      [
        ['p50 latency', latency.currentP50Ms + ' ms'],
        ['p95 latency', latency.currentP95Ms + ' ms'],
        ['p99 latency', latency.currentP99Ms + ' ms'],
        ['Error rate', Number(latency.errorRatePct).toFixed(1) + '%'],
      ].forEach(function (entry) {
        const card = document.createElement('div');
        card.className = 'metric-card';
        const label = document.createElement('div');
        label.className = 'metric-label';
        label.textContent = entry[0];
        const value = document.createElement('div');
        value.className = 'metric-value';
        value.textContent = entry[1];
        card.appendChild(label);
        card.appendChild(value);
        metrics.appendChild(card);
      });
      panel.appendChild(metrics);

      [
        ['Transaction:', latency.impactedTransaction],
        ['Delayed dependency:', latency.dependencyName],
        ['Status:', statusLabel],
      ].forEach(function (entry) {
        const row = document.createElement('div');
        row.className = 'queue-detail-row';
        const label = document.createElement('strong');
        label.textContent = entry[0];
        const value = document.createElement('span');
        value.textContent = ' ' + entry[1];
        row.appendChild(label);
        row.appendChild(value);
        panel.appendChild(row);
      });

      const sloRow = document.createElement('div');
      sloRow.className = 'queue-detail-row';
      sloRow.textContent = 'SLO: p95 <= ' + latency.sloP95ThresholdMs + ' ms, error rate <= ' + latency.errorRateCeilingPct + '%; SLO breached: ' + (breached ? 'yes' : 'no') + '; Errors within ceiling: ' + (withinErrorCeiling ? 'yes' : 'no');
      panel.appendChild(sloRow);

      const configRow = document.createElement('div');
      configRow.className = 'queue-detail-row';
      configRow.textContent = 'Config change: ' + (latency.configChangeReason || 'No config change reported') + ' (v' + (latency.configVersion || 'unknown') + ' by ' + (latency.configChangedBy || 'unknown') + ' at ' + (latency.configChangedAt || 'unknown') + ')';
      panel.appendChild(configRow);

      if (latency.runId) {
        const runRow = document.createElement('div');
        runRow.className = 'queue-detail-row';
        runRow.textContent = 'Run correlation id: ' + latency.runId;
        panel.appendChild(runRow);
      }

      const freshness = document.createElement('div');
      freshness.className = 'queue-detail-row';
      freshness.textContent = 'Last updated: ' + (latency.lastUpdatedAt ? new Date(latency.lastUpdatedAt).toLocaleString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', month: 'short', day: 'numeric' }) : 'unknown');
      if (isUnavailable) {
        freshness.textContent += ' · unavailable';
      } else if (latency.status === 'stale') {
        freshness.textContent += ' · stale';
      }
      panel.appendChild(freshness);
    }

    function startOrderDependencyLatencyIncident(runId) {
      ORDER_DEPENDENCY_LATENCY.runId = runId || ('run-' + Date.now());
      ORDER_DEPENDENCY_LATENCY.delayMode = 'ramp';
      ORDER_DEPENDENCY_LATENCY.mode = 'ramp';
      ORDER_DEPENDENCY_LATENCY.currentP50Ms = ORDER_DEPENDENCY_LATENCY.rampFromMs;
      ORDER_DEPENDENCY_LATENCY.currentP95Ms = ORDER_DEPENDENCY_LATENCY.rampFromMs;
      ORDER_DEPENDENCY_LATENCY.currentP99Ms = ORDER_DEPENDENCY_LATENCY.rampFromMs;
      ORDER_DEPENDENCY_LATENCY.errorRatePct = 0.4;
      ORDER_DEPENDENCY_LATENCY.configVersion = 'incident-v2';
      ORDER_DEPENDENCY_LATENCY.configChangeReason = 'Emergency change: pricing-lookup dependency timeout raised from ' + ORDER_DEPENDENCY_LATENCY.rampFromMs + 'ms to ' + ORDER_DEPENDENCY_LATENCY.rampToMs + 'ms in order-pricing-dependency-config to accommodate a vendor rate-limit workaround.';
      ORDER_DEPENDENCY_LATENCY.configChangedBy = 'platform-ops-oncall';
      ORDER_DEPENDENCY_LATENCY.configChangedAt = new Date().toISOString();
      ORDER_DEPENDENCY_LATENCY.status = 'active';
      ORDER_DEPENDENCY_LATENCY.lastUpdatedAt = new Date().toISOString();
      appendRefillOrderLog('warn', 'order-pricing-dependency delay ramping toward ' + ORDER_DEPENDENCY_LATENCY.rampToMs + 'ms after config change ' + ORDER_DEPENDENCY_LATENCY.configVersion + '. Pods remain Ready; error rate remains low.');
      renderOrderDependencyLatency();
      return ORDER_DEPENDENCY_LATENCY;
    }

    function advanceOrderDependencyLatencyRamp() {
      if (ORDER_DEPENDENCY_LATENCY.status !== 'active') return ORDER_DEPENDENCY_LATENCY;
      const next = Math.min(ORDER_DEPENDENCY_LATENCY.rampToMs, ORDER_DEPENDENCY_LATENCY.currentP95Ms + 200);
      ORDER_DEPENDENCY_LATENCY.currentP50Ms = Math.round(next * 0.55);
      ORDER_DEPENDENCY_LATENCY.currentP95Ms = next;
      ORDER_DEPENDENCY_LATENCY.currentP99Ms = Math.round(next * 1.15);
      ORDER_DEPENDENCY_LATENCY.lastUpdatedAt = new Date().toISOString();
      renderOrderDependencyLatency();
      return ORDER_DEPENDENCY_LATENCY;
    }

    function recoverOrderDependencyLatency() {
      ORDER_DEPENDENCY_LATENCY.delayMode = 'fixed';
      ORDER_DEPENDENCY_LATENCY.mode = 'recovery';
      ORDER_DEPENDENCY_LATENCY.currentP50Ms = 45;
      ORDER_DEPENDENCY_LATENCY.currentP95Ms = ORDER_DEPENDENCY_LATENCY.baselineP95Ms;
      ORDER_DEPENDENCY_LATENCY.currentP99Ms = 72;
      ORDER_DEPENDENCY_LATENCY.errorRatePct = 0.2;
      ORDER_DEPENDENCY_LATENCY.configVersion = 'baseline-v1';
      ORDER_DEPENDENCY_LATENCY.configChangeReason = 'Baseline pricing-lookup timeout configuration restored. No incident is active.';
      ORDER_DEPENDENCY_LATENCY.configChangedBy = 'platform-baseline';
      ORDER_DEPENDENCY_LATENCY.configChangedAt = new Date().toISOString();
      ORDER_DEPENDENCY_LATENCY.status = 'recovered';
      ORDER_DEPENDENCY_LATENCY.lastUpdatedAt = new Date().toISOString();
      appendRefillOrderLog('info', 'order-pricing-dependency latency recovered below the ' + ORDER_DEPENDENCY_LATENCY.sloP95ThresholdMs + 'ms SLO threshold.');
      renderOrderDependencyLatency();
      return ORDER_DEPENDENCY_LATENCY;
    }

    // Domain: Bulk Tank
    const BULK_TANK_SAFETY_ALARM = {
      alarmId: 'BT-SAFETY-ALM-00042',
      assetId: 'BT-1551',
      alarmType: 'rapid-level-drop',
      readingAgeMinutes: 9,
      simulatedSeverity: 'SEV-1',
      ackState: 'Pending',
      acknowledgedBy: null,
      acknowledgedAt: null,
      triggeredAt: '2025-02-11T06:41:52Z',
      lastUpdatedAt: '2025-02-11T06:51:12Z',
      processingComponent: 'safety-compliance-monitor',
      processingState: 'suppressed',
      threshold: 'SIMULATED tank level drop below 20% after 15 minutes; requires AmeriGas safety SME validation.',
      processedExactlyOnce: false,
      recoveredAt: null
    };

    function formatAlarmTimestamp(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function appendSafetyLog(level, message) {
      const box = document.getElementById('ops-log');
      if (!box) return;
      const ts = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.innerHTML = '<span class="ts">[' + ts + ']</span> <span class="' + level + '">[' + level.toUpperCase() + ']</span> ' + message;
      box.prepend(line);
      if (box.children.length > 50) box.removeChild(box.lastChild);
    }

    function renderBulkTankSafetyAlarm() {
      const card = document.getElementById('bulk-tank-safety-alarm');
      if (!card) return;
      const chipClass = BULK_TANK_SAFETY_ALARM.processingState === 'recovered' ? 'recovered' : BULK_TANK_SAFETY_ALARM.ackState === 'Acknowledged' ? 'acknowledged' : 'pending';
      const alertText = BULK_TANK_SAFETY_ALARM.processingState === 'recovered' ? 'resolved' : BULK_TANK_SAFETY_ALARM.ackState === 'Acknowledged' ? 'acknowledged' : 'pending acknowledgement';
      const statusSummary = BULK_TANK_SAFETY_ALARM.processingState === 'recovered'
        ? 'Alarm was processed exactly once and the duplicate incident was suppressed.'
        : 'Workload is healthy, but the processing component continues to delay or suppress the pending alarm.';
      card.className = 'alarm-card ' + chipClass;
      card.innerHTML =
        '<div class="alarm-header">' +
        '  <div class="alarm-alert">Bulk Tank Safety Signal</div>' +
        '  <span class="alarm-chip ' + chipClass + '">' + alertText + '</span>' +
        '</div>' +
        '<div class="alarm-title">' + BULK_TANK_SAFETY_ALARM.alarmId + ' · Asset ' + BULK_TANK_SAFETY_ALARM.assetId + '</div>' +
        '<div class="alarm-grid">' +
        '  <div class="alarm-metric"><span class="label">Severity</span><span class="value">' + BULK_TANK_SAFETY_ALARM.simulatedSeverity + '</span></div>' +
        '  <div class="alarm-metric"><span class="label">Reading Age</span><span class="value">' + BULK_TANK_SAFETY_ALARM.readingAgeMinutes + ' min</span></div>' +
        '  <div class="alarm-metric"><span class="label">Acknowledgement</span><span class="value">' + BULK_TANK_SAFETY_ALARM.ackState + '</span></div>' +
        '  <div class="alarm-metric"><span class="label">Triggered</span><span class="value">' + formatAlarmTimestamp(BULK_TANK_SAFETY_ALARM.triggeredAt) + '</span></div>' +
        '  <div class="alarm-metric"><span class="label">Last Update</span><span class="value">' + formatAlarmTimestamp(BULK_TANK_SAFETY_ALARM.lastUpdatedAt) + '</span></div>' +
        '  <div class="alarm-metric"><span class="label">Processor</span><span class="value">' + BULK_TANK_SAFETY_ALARM.processingComponent + '</span></div>' +
        '</div>' +
        '<div class="alarm-note"><strong>SIMULATED threshold:</strong> ' + BULK_TANK_SAFETY_ALARM.threshold + ' This wording requires AmeriGas safety SME validation before production use.</div>' +
        '<div class="alarm-note" style="margin-top:.55rem"><strong>Processing state:</strong> ' + statusSummary + '</div>';
    }

    function acknowledgeBulkTankSafetyAlarm() {
      if (BULK_TANK_SAFETY_ALARM.ackState === 'Acknowledged' || BULK_TANK_SAFETY_ALARM.processingState === 'recovered') {
        return;
      }
      BULK_TANK_SAFETY_ALARM.ackState = 'Acknowledged';
      BULK_TANK_SAFETY_ALARM.acknowledgedBy = 'dispatch-console';
      BULK_TANK_SAFETY_ALARM.acknowledgedAt = new Date().toISOString();
      BULK_TANK_SAFETY_ALARM.lastUpdatedAt = BULK_TANK_SAFETY_ALARM.acknowledgedAt;
      appendSafetyLog('warn', 'SIMULATED bulk tank alarm ' + BULK_TANK_SAFETY_ALARM.alarmId + ' acknowledged by dispatch-console while the processing component remains delayed.');
      renderBulkTankSafetyAlarm();
    }

    function processBulkTankSafetyAlarm() {
      if (BULK_TANK_SAFETY_ALARM.processedExactlyOnce) {
        appendSafetyLog('info', 'Recovery for alarm ' + BULK_TANK_SAFETY_ALARM.alarmId + ' was already processed exactly once; duplicate incident suppressed.');
        renderBulkTankSafetyAlarm();
        return;
      }
      BULK_TANK_SAFETY_ALARM.processedExactlyOnce = true;
      BULK_TANK_SAFETY_ALARM.processingState = 'recovered';
      BULK_TANK_SAFETY_ALARM.ackState = 'Recovered';
      BULK_TANK_SAFETY_ALARM.recoveredAt = new Date().toISOString();
      BULK_TANK_SAFETY_ALARM.lastUpdatedAt = BULK_TANK_SAFETY_ALARM.recoveredAt;
      appendSafetyLog('info', 'safety-compliance-monitor processed pending alarm ' + BULK_TANK_SAFETY_ALARM.alarmId + ' exactly once and de-duplicated the incident.');
      renderBulkTankSafetyAlarm();
    }

    const LOG_MESSAGES = [
      { level: 'info', msg: 'Bulk delivery route updated for Brookside: +120 gallons scheduled' },
      { level: 'warn', msg: 'Low tank warning: Oak Ridge reserve down to {n}% tank fill' },
      { level: 'info', msg: 'Delivery truck T-{id} en route to Walmart Collegeville (ETA {n}min)' },
      { level: 'info', msg: 'Daily tank audit complete: {n} residential sites below threshold' },
      { level: 'warn', msg: 'Temperature drop forecast — demand increase expected Thu-Fri' },
      { level: 'info', msg: 'Refill recommendation recalculated: {n} priority tank sites' },
      { level: 'info', msg: 'Bulk delivery completed at Giant Pottstown: 1,200 gallons delivered' },
      { level: 'err',  msg: 'Connection timeout to MongoDB replica' },
      { level: 'warn', msg: 'Costco Plymouth Meeting tank reserve at capacity — hold deliveries' },
      { level: 'info', msg: 'RabbitMQ consumer reconnected successfully' },
      { level: 'info', msg: "Lowe's Exton compliance check passed — all tank seals intact" },
      { level: 'warn', msg: 'Delivery T-{id} delayed: traffic on I-76 ({n}min ETA slip)' },
    ];

    function addLogEntry() {
      const box = document.getElementById('ops-log');
      const tmpl = LOG_MESSAGES[rand(0, LOG_MESSAGES.length - 1)];
      const ts = new Date().toLocaleTimeString();
      const text = tmpl.msg.replace('{id}', rand(1000, 9999)).replace('{n}', rand(2, 60));
      const line = document.createElement('div');
      line.innerHTML = '<span class="ts">[' + ts + ']</span> <span class="' + tmpl.level + '">[' + tmpl.level.toUpperCase() + ']</span> ' + text;
      box.prepend(line);
      if (box.children.length > 50) box.removeChild(box.lastChild);
    }

    // Domain: Shared
    function fetchHealth(url){
      return fetch(url, { signal: AbortSignal.timeout(3000) })
        .then(function(response){
          if (!response.ok) return Promise.reject(new Error('HTTP ' + response.status));
          return { ok: true, status: response.status };
        })
        .catch(function(err){
          return { ok: false, status: err && err.message ? err.message : 'unreachable' };
        });
    }

    function applyDispatchState(healthy, message, timestamp){
      DISPATCH_STATE = { healthy: healthy, message: message, lastUpdated: timestamp || new Date().toISOString() };
      if (healthy) {
        setDispatchBanner('healthy', message || 'Live dispatch telemetry is current.', DISPATCH_STATE.lastUpdated);
      } else {
        setDispatchBanner('degraded', message || 'Operations data is temporarily delayed while the dispatch pipeline recovers.', DISPATCH_STATE.lastUpdated);
      }
    }

    function loadHealth() {
      const grid = document.getElementById('health-grid');
      grid.innerHTML = '';
      Promise.all([
        fetchHealth('/api/inventory/health'),
        fetchHealth('/api/tanks/health'),
        fetchHealth('/api/orders/health')
      ]).then(function(results){
        const inventory = results[0];
        const tank = results[1];
        const orders = results[2];
        const state = PortalHealthState.derivePortalState({
          inventory: inventory,
          tank: tank,
          orders: orders,
          updatedAt: new Date().toISOString()
        }, 'dispatch', 30000);
        applyDispatchState(!state.degraded, state.message, state.lastUpdated);
        const svcs = [
          { name: 'Inventory Service', ok: inventory.ok, detail: inventory.ok ? 'Inventory stream responding normally.' : 'HTTP ' + inventory.status },
          { name: 'Tank Monitor', ok: tank.ok, detail: tank.ok ? 'Tank telemetry is flowing.' : 'HTTP ' + tank.status },
          { name: 'Order Service', ok: orders.ok, detail: orders.ok ? 'Orders flow is normal.' : 'HTTP ' + orders.status },
          { name: 'MongoDB', ok: !state.services.mongodb.degraded, detail: state.services.mongodb.degraded ? 'Dependency issue detected; stale dashboard values are being shown.' : 'MongoDB dependency is healthy.' },
          { name: 'RabbitMQ', ok: !state.services.rabbitmq.degraded, detail: state.services.rabbitmq.degraded ? 'Dependency issue detected; queue-driven updates are delayed.' : 'RabbitMQ dependency is healthy.' },
        ];
        svcs.forEach(svc => {
          const card = document.createElement('div');
          card.className = 'card';
          const color = svc.ok ? 'var(--green)' : 'var(--red)';
          const dotName = svc.ok ? 'green' : 'red';
          card.innerHTML = '<h3>' + svc.name + '</h3><div style="font-size:1.1rem;font-weight:600;color:' + color + '"><span class="dot ' + dotName + '"></span> ' + (svc.ok ? 'Healthy' : 'Degraded') + '</div><div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">' + svc.detail + '</div>';
          grid.appendChild(card);
        });
      }).catch(function(){
        applyDispatchState(false, 'Operations data is temporarily delayed while the platform reconnects.', new Date().toISOString());
        const svcs = [
          { name: 'Inventory Service', ok: false, detail: 'Service check failed' },
          { name: 'Tank Monitor', ok: false, detail: 'Service check failed' },
          { name: 'Order Service', ok: false, detail: 'Service check failed' },
          { name: 'MongoDB', ok: false, detail: 'Dependency status uncertain; stale operational values are being shown.' },
          { name: 'RabbitMQ', ok: false, detail: 'Dependency status uncertain; queue-driven automation is delayed.' },
        ];
        svcs.forEach(svc => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<h3>' + svc.name + '</h3><div style="font-size:1.1rem;font-weight:600;color:var(--red)"><span class="dot red"></span> Degraded</div><div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">' + svc.detail + '</div>';
          grid.appendChild(card);
        });
      });
    }

    function refreshCages() { generateLocationData(); renderCageGrid(); renderDeliveryQueue(); }

    // Domain: Shared
    generateLocationData();
    setDispatchBanner('healthy', 'Live dispatch telemetry is current.', new Date().toISOString());
    updateClock(); updateMetrics(); renderCageGrid(); renderDeliveryQueue(); renderForecast(); renderRefillOrderBacklog(); renderOrderDependencyLatency(); renderBulkTankSafetyAlarm(); appendSafetyLog('warn', 'SIMULATED bulk tank alarm ' + BULK_TANK_SAFETY_ALARM.alarmId + ' remains pending in safety-compliance-monitor while workload pods stay healthy.');
    fetchOrderDependencyLatencyStatus();
    loadHealth();
    for (let i = 0; i < 10; i++) addLogEntry();
    setInterval(updateClock, 1000);
    setInterval(updateMetrics, 5000);
    setInterval(refreshCages, 10000);
    setInterval(addLogEntry, 4000);
    setInterval(loadHealth, 30000);
    setInterval(fetchOrderDependencyLatencyStatus, ORDER_DEPENDENCY_LATENCY_POLL_INTERVAL_MS);
    setInterval(renderForecast, 60000);
    </script>
    </body>
    </html>


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-console-nginx
  namespace: propane
data:
  default.conf: |
    server {
        listen 8081;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;

        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
        location = /api/inventory/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://inventory-service.propane.svc.cluster.local:3002/health;
        }
        location = /api/tanks/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tank-monitor.propane.svc.cluster.local:3000/health;
        }
        location = /api/orders/health {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://order-service.propane.svc.cluster.local:3001/health;
        }
        location = /api/orders/latency-status {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://order-checkout-probe.propane.svc.cluster.local:4100/status;
        }
        location /api/ {
            return 404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-console
  namespace: propane
  labels:
    app: dispatch-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatch-console
  template:
    metadata:
      labels:
        app: dispatch-console
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: dispatch-console
          image: nginx:alpine
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: dispatch-console-html
        - name: nginx-conf
          configMap:
            name: dispatch-console-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-console
  namespace: propane
spec:
  type: LoadBalancer
  selector:
    app: dispatch-console
  ports:
    - port: 80
      targetPort: 8081

---
# =============================================================================
# OpenTelemetry Collector - telemetry pipeline to workspace-based App Insights
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: propane
data:
  otel-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'propane-services'
              scrape_interval: 30s
              static_configs:
                - targets:
                    - tank-monitor.propane.svc.cluster.local:3000
                    - inventory-service.propane.svc.cluster.local:3002
                    - order-service.propane.svc.cluster.local:3001
                    - order-pricing-dependency.propane.svc.cluster.local:4000
                    - order-checkout-probe.propane.svc.cluster.local:4100
    processors:
      batch:
        timeout: 10s
        send_batch_size: 256
      memory_limiter:
        limit_mib: 256
        spike_limit_mib: 64
        check_interval: 5s
      resource:
        attributes:
          - key: cloud.provider
            value: azure
            action: upsert
          - key: cloud.platform
            value: azure_aks
            action: upsert
          - key: service.namespace
            value: propane
            action: upsert
    exporters:
      azuremonitor:
        connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
        spaneventsenabled: true
        exception_events_enabled: true
        sending_queue:
          enabled: true
          queue_size: 2048
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [azuremonitor]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resource, batch]
          exporters: [azuremonitor]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [azuremonitor]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: propane
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args: ["--config=/etc/otel/otel-config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: application-insights-connection
                  key: connection-string
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: propane
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

---
# =============================================================================
# Synthetic telemetry probe - observes real service responses and emits OTLP
# Domain: Shared
# The telemetry-probe-source ConfigMap is generated from the repo-owned
# tools/telemetry-probe/probe.js by scripts/deploy.ps1.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: telemetry-baseline
  namespace: propane
  labels:
    app: telemetry-baseline
    app.kubernetes.io/part-of: amerigas-propane-demo
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: telemetry-baseline
            sre-demo: breakable
        spec:
          restartPolicy: Never
          nodeSelector:
            nodepool-type: user
          containers:
            - name: telemetry-probe
              image: node:22.14.0-alpine
              command: ["node", "/opt/telemetry/probe.js"]
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: propane-telemetry-config
                      key: OTEL_EXPORTER_OTLP_ENDPOINT
                - name: RUN_CORRELATION_ID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: SCENARIO_ID
                  value: observability-baseline
              volumeMounts:
                - name: probe-source
                  mountPath: /opt/telemetry
                  readOnly: true
          volumes:
            - name: probe-source
              configMap:
                name: telemetry-probe-source

