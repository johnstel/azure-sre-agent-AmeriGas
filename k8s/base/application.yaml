# =============================================================================
# AmeriGas Propane Distribution Platform - Base Application Deployment
# =============================================================================
# This is the healthy baseline deployment of the AmeriGas Propane Distribution
# Platform for demonstrating Azure SRE Agent diagnosis capabilities.
#
# Domain Model — this platform supports TWO distinct propane business
# domains. See docs/sre-agent-knowledge.md "Domain Model" for full detail.
#   - Bulk Tank: residential/commercial bulk propane tanks & deliveries.
#     Vocabulary: gallons, tank percentage, consumption, refill
#     recommendation, delivery scheduling.
#   - Cylinder Exchange: retail cylinder exchange cages at partner stores.
#     Vocabulary: full/empty/reserved cylinder counts, cage replenishment,
#     exchange-location terminology.
# Each resource below is annotated with its Domain in a comment header.
#
# Architecture:
# - customer-portal: Vue.js customer self-service portal (Bulk Tank account
#   view + Cylinder Exchange nearby-location browsing)
# - dispatch-console: Vue.js Retail Cage Operations Center (Cylinder Exchange)
# - tank-monitor: Node.js IoT tank level monitoring API (Bulk Tank)
# - inventory-service: Rust-based propane inventory & pricing API (Shared)
# - order-service: Go order fulfillment & processing (Shared)
# - demand-service: Python propane demand forecasting (optional, Shared)
# - usage-simulator: Customer propane usage pattern generator (Bulk Tank)
# - order-worker: Order processing worker (Shared)
# - order-pricing-dependency: Node.js synthetic order-checkout dependency
#   hop simulator for the dependency-latency scenario, issue #22 (Shared)
# - order-checkout-probe: Node.js synthetic order-checkout traffic
#   generator with deterministic transaction/run correlation ids,
#   issue #22 (Shared)
#
# Data Services (in-cluster):
# - rabbitmq: Event bus (tank alerts, order events, fulfillment updates) (Shared)
# - mongodb: Tank readings, delivery records, customer data (Shared)
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: propane
  labels:
    app.kubernetes.io/part-of: amerigas-propane-demo
    sre-agent-demo: "true"

---
# =============================================================================
# Telemetry Configuration - non-secret OpenTelemetry settings
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: propane-telemetry-config
  namespace: propane
  labels:
    app.kubernetes.io/part-of: amerigas-propane-demo
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.propane.svc.cluster.local:4318"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.5"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=demo,service.namespace=propane"

---
# =============================================================================
# RabbitMQ - Event bus (tank alerts, order events, fulfillment updates)
# Domain: Shared — carries Bulk Tank alerts (tank-events) and delivery/order
# events used by both the Bulk Tank and Cylinder Exchange domains.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: propane
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: rabbitmq
          image: rabbitmq:3.11-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: propane
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

---
# =============================================================================
# MongoDB - Tank readings, delivery records, customer data (Azure Managed Disk via CSI driver)
# Domain: Shared — persists Bulk Tank readings (tank_readings collection) plus
# delivery/order and customer account records used across both domains.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data-pvc
  namespace: propane
  labels:
    app: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi # Uses Azure Managed Disk CSI driver (default in AKS)
  resources:
    requests:
      storage: 8Gi

---
# =============================================================================
# MongoDB - Tank & Delivery Database
# Domain: Shared (see above)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: propane
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: mongodb
          image: mongo:4.4
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: propane
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

---
# =============================================================================
# Inventory Service - Rust-based propane inventory & pricing API
# Domain: Shared — serves the Bulk Tank product catalog (delivery pricing per
# gallon) and the Cylinder Exchange cage catalog (cage capacity, cylinder
# pricing tiers) from a single pricing/catalog API.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: propane
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: inventory-service
          image: ghcr.io/azure-samples/aks-store-demo/product-service:latest
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: AI_SERVICE_URL
              value: "http://demand-service:5001/"
            - name: OTEL_SERVICE_NAME
              value: "inventory-service"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: propane
spec:
  selector:
    app: inventory-service
  ports:
    - port: 3002
      targetPort: 3002

---
# =============================================================================
# Tank Monitor - Node.js IoT tank level monitoring API
# Domain: Bulk Tank — ingests smart sensor telemetry from residential and
# commercial bulk propane tanks only (gallons, tank percentage, leak
# detection). Not used for retail cylinder exchange cage inventory, which is
# tracked separately via exchange/inventory transaction counts.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tank-monitor
  namespace: propane
  labels:
    app: tank-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tank-monitor
  template:
    metadata:
      labels:
        app: tank-monitor
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: tank-monitor
          image: ghcr.io/azure-samples/aks-store-demo/order-service:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: ORDER_QUEUE_HOSTNAME
              value: "rabbitmq"
            - name: ORDER_QUEUE_PORT
              value: "5672"
            - name: ORDER_QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: ORDER_QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: ORDER_QUEUE_NAME
              value: "tank-events"
            - name: FASTIFY_ADDRESS
              value: "0.0.0.0"
            - name: OTEL_SERVICE_NAME
              value: "tank-monitor"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: tank-monitor
  namespace: propane
spec:
  selector:
    app: tank-monitor
  ports:
    - port: 3000
      targetPort: 3000

---
# =============================================================================
# Order Service - Go order fulfillment & processing
# Domain: Shared — processes both Bulk Tank delivery/refill orders and
# Cylinder Exchange cage restock orders.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: propane
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: order-service
          image: ghcr.io/azure-samples/aks-store-demo/makeline-service:latest
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: ORDER_QUEUE_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: uri
            - name: ORDER_QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: ORDER_QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: ORDER_QUEUE_NAME
              value: "tank-events"
            - name: ORDER_DB_URI
              value: "mongodb://mongodb:27017"
            - name: ORDER_DB_NAME
              value: "propanedb"
            - name: ORDER_DB_COLLECTION_NAME
              value: "tank_readings"
            - name: OTEL_SERVICE_NAME
              value: "order-service"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: propane
spec:
  selector:
    app: order-service
  ports:
    - port: 3001
      targetPort: 3001

---
# =============================================================================
# Order Pricing Dependency - synthetic order-checkout dependency hop
# Domain: Shared — issue #22 (gradual dependency-latency incident). This is
# a repo-owned, non-privileged simulator standing in for a downstream
# pricing/tax lookup that order-service would call during checkout. It does
# NOT proxy to any external or caller-supplied target (no SSRF surface): the
# delay is computed in-process from `order-pricing-dependency-config` only.
# The healthy baseline config here (fixed, low delay) is what k8s/scenarios/
# dependency-latency.yaml overrides to raise p95 above the documented SLO.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-pricing-dependency-config
  namespace: propane
  labels:
    app: order-pricing-dependency
data:
  delay_mode: "fixed"
  fixed_delay_ms: "45"
  jitter_spread_ms: "15"
  error_rate_bp: "20"
  slo_p95_threshold_ms: "500"
  error_rate_ceiling_bp: "200"
  ramp_from_ms: "45"
  ramp_to_ms: "45"
  ramp_duration_seconds: "60"
  config_version: "baseline-v1"
  config_change_reason: "Baseline pricing-lookup timeout configuration. No incident is active."
  config_changed_by: "platform-baseline"
  config_changed_at: "2025-01-01T00:00:00Z"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-pricing-dependency-script
  namespace: propane
  labels:
    app: order-pricing-dependency
data:
  server.js: |
    'use strict';
    // Domain: Shared — self-contained dependency-hop simulator for issue #22.
    // Mirrors the pure math in tools/mission-control/order-dependency-latency.js
    // (see order-dependency-latency-scenario.test.js for the cross-check).
    const http = require('http');
    const fs = require('fs');
    const path = require('path');
    const crypto = require('crypto');

    const CONFIG_DIR = process.env.CONFIG_DIR || '/config';
    const PORT = Number(process.env.PORT || 4000);
    const SERVICE_NAME = process.env.OTEL_SERVICE_NAME || 'order-pricing-dependency';
    const SERVICE_NAMESPACE = process.env.SERVICE_NAMESPACE || 'propane';
    const ENVIRONMENT = process.env.DEPLOYMENT_ENVIRONMENT || 'demo';
    const OTLP_ENDPOINT = process.env.OTEL_EXPORTER_OTLP_ENDPOINT || '';

    function readConfig() {
      const out = {};
      try {
        for (const file of fs.readdirSync(CONFIG_DIR)) {
          if (file.startsWith('..')) continue;
          try { out[file] = fs.readFileSync(path.join(CONFIG_DIR, file), 'utf8').trim(); } catch (e) { /* atomic symlink swap in progress */ }
        }
      } catch (e) { /* config volume not mounted yet */ }
      return out;
    }

    function computeDelayMs(config, elapsedMs) {
      const mode = config.delay_mode === 'ramp' ? 'ramp' : 'fixed';
      if (mode === 'fixed') return Math.max(0, Number(config.fixed_delay_ms || 0));
      const from = Number(config.ramp_from_ms || 0);
      const to = config.ramp_to_ms != null ? Number(config.ramp_to_ms) : from;
      const durationMs = Math.max(1, Number(config.ramp_duration_seconds || 1) * 1000);
      const clamped = Math.max(0, Math.min(elapsedMs, durationMs));
      const ratio = clamped / durationMs;
      return Math.max(0, Math.round(from + (to - from) * ratio));
    }

    function deterministicJitterMs(sequence, spreadMs) {
      const spread = Math.max(0, Number(spreadMs) || 0);
      if (spread === 0) return 0;
      const x = Math.sin(sequence * 12.9898) * 43758.5453;
      return Math.floor((x - Math.floor(x)) * spread);
    }

    function isSyntheticError(sequence, errorRateBp) {
      const bp = Number(errorRateBp) || 0;
      if (bp <= 0) return false;
      return ((Math.abs(sequence) * 9973) % 10000) < bp;
    }

    function computeQuantile(sortedSamples, percentile) {
      if (!sortedSamples.length) return 0;
      const rank = Math.min(sortedSamples.length - 1, Math.max(0, Math.ceil((percentile / 100) * sortedSamples.length) - 1));
      return sortedSamples[rank];
    }

    function parseTraceParent(header) {
      if (typeof header !== 'string') return null;
      const parts = header.split('-');
      if (parts.length !== 4 || parts[0] !== '00') return null;
      const traceId = parts[1];
      const spanId = parts[2];
      if (!/^[0-9a-f]{32}$/.test(traceId) || !/^[0-9a-f]{16}$/.test(spanId)) return null;
      if (/^0+$/.test(traceId) || /^0+$/.test(spanId)) return null;
      return { traceId: traceId, spanId: spanId };
    }

    function newHexId(bytes) { return crypto.randomBytes(bytes).toString('hex'); }

    let lastConfigVersion = null;
    let configAppliedAtMs = Date.now();
    let requestSequence = 0;
    const HISTOGRAM_WINDOW = 500;
    const samples = [];
    let totalRequests = 0;
    let totalErrors = 0;

    function recordSample(ms) {
      samples.push(ms);
      if (samples.length > HISTOGRAM_WINDOW) samples.shift();
    }

    // Fixed, env-configured OTLP endpoint only — never derived from request
    // input, so this can never become an arbitrary open proxy/SSRF target.
    function otlpExport(pathSuffix, payload) {
      if (!OTLP_ENDPOINT) return;
      try {
        const url = OTLP_ENDPOINT.replace(/\/$/, '') + pathSuffix;
        fetch(url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
          signal: AbortSignal.timeout(2000),
        }).catch(function (err) {
          console.log(JSON.stringify({ event: 'otlp_export_failed', endpoint: url, error: String(err && err.message || err) }));
        });
      } catch (err) {
        console.log(JSON.stringify({ event: 'otlp_export_failed', error: String(err && err.message || err) }));
      }
    }

    function exportDependencySpan(args) {
      const payload = {
        resourceSpans: [{
          resource: { attributes: [
            { key: 'service.name', value: { stringValue: SERVICE_NAME } },
            { key: 'service.namespace', value: { stringValue: SERVICE_NAMESPACE } },
            { key: 'deployment.environment', value: { stringValue: ENVIRONMENT } },
          ] },
          scopeSpans: [{
            scope: { name: 'order-dependency-latency' },
            spans: [{
              traceId: args.traceId,
              spanId: args.depSpanId,
              parentSpanId: args.rootSpanId,
              name: 'dependency.pricing-lookup',
              kind: 3,
              startTimeUnixNano: args.startNs,
              endTimeUnixNano: args.endNs,
              attributes: [
                { key: 'scenario.id', value: { stringValue: 'latency' } },
                { key: 'scenario.run_id', value: { stringValue: args.runId } },
                { key: 'transaction.id', value: { stringValue: args.transactionId } },
                { key: 'dependency.delay_ms', value: { intValue: String(args.delayMs) } },
                { key: 'net.peer.name', value: { stringValue: SERVICE_NAME } },
              ],
              status: { code: args.statusOk ? 1 : 2 },
            }],
          }],
        }],
      };
      otlpExport('/v1/traces', payload);
    }

    const server = http.createServer(function (req, res) {
      if (req.method === 'GET' && req.url === '/healthz') {
        res.writeHead(200, { 'content-type': 'application/json' });
        res.end(JSON.stringify({ status: 'ok' }));
        return;
      }

      if (req.method === 'GET' && req.url === '/metrics') {
        const sorted = samples.slice().sort(function (a, b) { return a - b; });
        const cfg = readConfig();
        const p50 = computeQuantile(sorted, 50);
        const p95 = computeQuantile(sorted, 95);
        const p99 = computeQuantile(sorted, 99);
        const lines = [
          '# HELP order_dependency_request_duration_ms_p50 Rolling p50 dependency request duration in milliseconds.',
          '# TYPE order_dependency_request_duration_ms_p50 gauge',
          'order_dependency_request_duration_ms_p50{service="' + SERVICE_NAME + '"} ' + p50,
          '# HELP order_dependency_request_duration_ms_p95 Rolling p95 dependency request duration in milliseconds.',
          '# TYPE order_dependency_request_duration_ms_p95 gauge',
          'order_dependency_request_duration_ms_p95{service="' + SERVICE_NAME + '"} ' + p95,
          '# HELP order_dependency_request_duration_ms_p99 Rolling p99 dependency request duration in milliseconds.',
          '# TYPE order_dependency_request_duration_ms_p99 gauge',
          'order_dependency_request_duration_ms_p99{service="' + SERVICE_NAME + '"} ' + p99,
          '# HELP order_dependency_requests_total Total pricing-lookup requests served.',
          '# TYPE order_dependency_requests_total counter',
          'order_dependency_requests_total{service="' + SERVICE_NAME + '"} ' + totalRequests,
          '# HELP order_dependency_errors_total Total pricing-lookup requests that returned a synthetic error.',
          '# TYPE order_dependency_errors_total counter',
          'order_dependency_errors_total{service="' + SERVICE_NAME + '"} ' + totalErrors,
          '# HELP order_dependency_config_change_timestamp_seconds Unix time the active delay config was last detected as changed.',
          '# TYPE order_dependency_config_change_timestamp_seconds gauge',
          'order_dependency_config_change_timestamp_seconds{service="' + SERVICE_NAME + '"} ' + Math.floor(configAppliedAtMs / 1000),
          '# HELP order_dependency_delay_mode_ramp Whether the dependency delay config is currently in ramp (1) or fixed (0) mode.',
          '# TYPE order_dependency_delay_mode_ramp gauge',
          'order_dependency_delay_mode_ramp{service="' + SERVICE_NAME + '"} ' + (cfg.delay_mode === 'ramp' ? 1 : 0),
          '',
        ];
        res.writeHead(200, { 'content-type': 'text/plain; version=0.0.4' });
        res.end(lines.join('\n'));
        return;
      }

      if (req.method === 'GET' && req.url === '/status') {
        const cfg = readConfig();
        const sorted = samples.slice().sort(function (a, b) { return a - b; });
        res.writeHead(200, { 'content-type': 'application/json' });
        res.end(JSON.stringify({
          service: SERVICE_NAME,
          config: cfg,
          configAppliedAt: new Date(configAppliedAtMs).toISOString(),
          totalRequests: totalRequests,
          totalErrors: totalErrors,
          quantilesMs: { p50: computeQuantile(sorted, 50), p95: computeQuantile(sorted, 95), p99: computeQuantile(sorted, 99) },
          errorRatePct: totalRequests > 0 ? (totalErrors / totalRequests) * 100 : 0,
        }, null, 2));
        return;
      }

      if (req.method === 'POST' && req.url === '/v1/pricing-lookup') {
        let body = '';
        req.on('data', function (chunk) { body += chunk; if (body.length > 8192) req.destroy(); });
        req.on('end', function () {
          let payload = {};
          try { payload = JSON.parse(body || '{}'); } catch (e) { payload = {}; }

          const cfg = readConfig();
          if (cfg.config_version && cfg.config_version !== lastConfigVersion) {
            const previous = lastConfigVersion;
            lastConfigVersion = cfg.config_version;
            configAppliedAtMs = Date.now();
            console.log(JSON.stringify({
              event: 'config_change_detected', service: SERVICE_NAME,
              previous_config_version: previous, config_version: cfg.config_version,
              delay_mode: cfg.delay_mode, config_change_reason: cfg.config_change_reason,
              config_changed_by: cfg.config_changed_by, config_changed_at: cfg.config_changed_at,
              detected_at: new Date(configAppliedAtMs).toISOString(),
            }));
          }

          const sequence = requestSequence++;
          const elapsedMs = Date.now() - configAppliedAtMs;
          const baseDelay = computeDelayMs(cfg, elapsedMs);
          const jitter = deterministicJitterMs(sequence, Number(cfg.jitter_spread_ms || 0));
          const delayMs = baseDelay + jitter;
          const failed = isSyntheticError(sequence, Number(cfg.error_rate_bp || 0));

          const inbound = parseTraceParent(req.headers.traceparent);
          const traceId = inbound ? inbound.traceId : newHexId(16);
          const rootSpanId = inbound ? inbound.spanId : newHexId(8);
          const depSpanId = newHexId(8);
          const startNs = (BigInt(Date.now()) * 1000000n).toString();

          totalRequests += 1;
          if (failed) totalErrors += 1;

          setTimeout(function () {
            recordSample(delayMs);
            const endNs = (BigInt(Date.now()) * 1000000n).toString();
            const statusCode = failed ? 503 : 200;
            const transactionId = payload.transactionId || ('TX-unknown-' + sequence);
            const runId = payload.runId || 'unknown';

            exportDependencySpan({
              traceId: traceId, rootSpanId: rootSpanId, depSpanId: depSpanId,
              transactionId: transactionId, runId: runId, delayMs: delayMs,
              statusOk: !failed, startNs: startNs, endNs: endNs,
            });

            console.log(JSON.stringify({
              event: 'dependency_request', service: SERVICE_NAME, dependency: 'pricing-lookup',
              transaction_id: transactionId, run_id: runId, trace_id: traceId, span_id: depSpanId,
              parent_span_id: rootSpanId, delay_ms: delayMs, status: failed ? 'error' : 'ok',
              delay_mode: cfg.delay_mode || 'fixed', config_version: cfg.config_version || 'unknown',
            }));

            res.writeHead(statusCode, { 'content-type': 'application/json', traceparent: '00-' + traceId + '-' + depSpanId + '-01' });
            res.end(JSON.stringify({
              status: failed ? 'error' : 'ok', dependency: 'pricing-lookup',
              transactionId: transactionId, delayMs: delayMs, traceId: traceId, spanId: depSpanId,
            }));
          }, delayMs);
        });
        return;
      }

      res.writeHead(404, { 'content-type': 'application/json' });
      res.end(JSON.stringify({ status: 'not_found' }));
    });

    server.listen(PORT, '0.0.0.0', function () {
      console.log(JSON.stringify({ event: 'startup', service: SERVICE_NAME, port: PORT }));
    });

