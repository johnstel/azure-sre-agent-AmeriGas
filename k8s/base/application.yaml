---
# =============================================================================
# Order Checkout Probe - synthetic order-checkout traffic generator
# Domain: Shared — issue #22. Generates stable synthetic checkout traffic
# against order-pricing-dependency with deterministic transaction/run
# correlation ids and W3C trace-context propagation, at both baseline and
# during the dependency-latency scenario.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-checkout-probe-script
  namespace: propane
  labels:
    app: order-checkout-probe
data:
  server.js: |
    'use strict';
    // Domain: Shared — self-contained synthetic order-checkout traffic
    // generator for issue #22. Mirrors the pure math in
    // tools/mission-control/order-dependency-latency.js (see
    // order-dependency-latency-scenario.test.js for the cross-check).
    const http = require('http');
    const crypto = require('crypto');

    const PORT = Number(process.env.PORT || 4100);
    const DEPENDENCY_URL = process.env.DEPENDENCY_URL || 'http://order-pricing-dependency.propane.svc.cluster.local:4000/v1/pricing-lookup';
    const REQUEST_INTERVAL_MS = Number(process.env.REQUEST_INTERVAL_MS || 1000);
    const SERVICE_NAME = process.env.OTEL_SERVICE_NAME || 'order-checkout-probe';
    const SERVICE_NAMESPACE = process.env.SERVICE_NAMESPACE || 'propane';
    const ENVIRONMENT = process.env.DEPLOYMENT_ENVIRONMENT || 'demo';
    const OTLP_ENDPOINT = process.env.OTEL_EXPORTER_OTLP_ENDPOINT || '';
    const SCENARIO_ID = process.env.SCENARIO_ID || 'latency';

    // The run id is derived once at process start so every request this pod
    // issues shares one deterministic, reproducible correlation id rather
    // than a fresh random id per request (see docs/BREAKABLE-SCENARIOS.md).
    const RUN_ID = process.env.RUN_ID || ('run-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-'));

    function newHexId(bytes) { return crypto.randomBytes(bytes).toString('hex'); }
    function deriveTraceId(runId, sequence) {
      return crypto.createHash('sha256').update('trace:' + runId + ':' + sequence).digest('hex').slice(0, 32);
    }
    function deriveSpanId(runId, sequence, label) {
      return crypto.createHash('sha256').update('span:' + runId + ':' + sequence + ':' + label).digest('hex').slice(0, 16);
    }
    function computeQuantile(sortedSamples, percentile) {
      if (!sortedSamples.length) return 0;
      const rank = Math.min(sortedSamples.length - 1, Math.max(0, Math.ceil((percentile / 100) * sortedSamples.length) - 1));
      return sortedSamples[rank];
    }

    let sequence = 0;
    const HISTOGRAM_WINDOW = 500;
    const samples = [];
    let totalRequests = 0;
    let totalErrors = 0;

    // Fixed, env-configured OTLP endpoint and dependency URL only — never
    // derived from request input, so this can never become an arbitrary
    // open proxy/SSRF target.
    function otlpExport(pathSuffix, payload) {
      if (!OTLP_ENDPOINT) return;
      try {
        const url = OTLP_ENDPOINT.replace(/\/$/, '') + pathSuffix;
        fetch(url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
          signal: AbortSignal.timeout(2000),
        }).catch(function (err) {
          console.log(JSON.stringify({ event: 'otlp_export_failed', endpoint: url, error: String(err && err.message || err) }));
        });
      } catch (err) {
        console.log(JSON.stringify({ event: 'otlp_export_failed', error: String(err && err.message || err) }));
      }
    }

    function issueCheckoutRequest() {
      const seq = sequence++;
      const transactionId = 'TX-' + RUN_ID + '-' + String(seq).padStart(6, '0');
      const traceId = deriveTraceId(RUN_ID, seq);
      const rootSpanId = deriveSpanId(RUN_ID, seq, 'order.checkout');
      const traceparent = '00-' + traceId + '-' + rootSpanId + '-01';
      const startedAt = Date.now();
      const startNs = (BigInt(startedAt) * 1000000n).toString();

      fetch(DEPENDENCY_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json', traceparent: traceparent },
        body: JSON.stringify({ transactionId: transactionId, runId: RUN_ID, scenarioId: SCENARIO_ID }),
        signal: AbortSignal.timeout(5000),
      }).then(function (response) {
        const durationMs = Date.now() - startedAt;
        const ok = response.ok;
        totalRequests += 1;
        if (!ok) totalErrors += 1;
        samples.push(durationMs);
        if (samples.length > HISTOGRAM_WINDOW) samples.shift();

        const endNs = (BigInt(Date.now()) * 1000000n).toString();
        otlpExport('/v1/traces', {
          resourceSpans: [{
            resource: { attributes: [
              { key: 'service.name', value: { stringValue: SERVICE_NAME } },
              { key: 'service.namespace', value: { stringValue: SERVICE_NAMESPACE } },
              { key: 'deployment.environment', value: { stringValue: ENVIRONMENT } },
            ] },
            scopeSpans: [{
              scope: { name: 'order-dependency-latency' },
              spans: [{
                traceId: traceId, spanId: rootSpanId, name: 'order.checkout', kind: 2,
                startTimeUnixNano: startNs, endTimeUnixNano: endNs,
                attributes: [
                  { key: 'scenario.id', value: { stringValue: SCENARIO_ID } },
                  { key: 'scenario.run_id', value: { stringValue: RUN_ID } },
                  { key: 'transaction.id', value: { stringValue: transactionId } },
                  { key: 'http.method', value: { stringValue: 'POST' } },
                  { key: 'http.route', value: { stringValue: '/v1/pricing-lookup' } },
                ],
                status: { code: ok ? 1 : 2 },
              }],
            }],
          }],
        });

        console.log(JSON.stringify({
          event: 'order_checkout', service: SERVICE_NAME, transaction_id: transactionId,
          run_id: RUN_ID, trace_id: traceId, span_id: rootSpanId, duration_ms: durationMs,
          status: ok ? 'ok' : 'error', http_status: response.status,
        }));
      }).catch(function (err) {
        totalRequests += 1;
        totalErrors += 1;
        console.log(JSON.stringify({
          event: 'order_checkout_failed', service: SERVICE_NAME, transaction_id: transactionId,
          run_id: RUN_ID, trace_id: traceId, error: String(err && err.message || err),
        }));
      });
    }

    setInterval(issueCheckoutRequest, REQUEST_INTERVAL_MS);

    const server = http.createServer(function (req, res) {
      if (req.method === 'GET' && req.url === '/healthz') {
        res.writeHead(200, { 'content-type': 'application/json' });
        res.end(JSON.stringify({ status: 'ok' }));
        return;
      }
      if (req.method === 'GET' && req.url === '/metrics') {
        const sorted = samples.slice().sort(function (a, b) { return a - b; });
        const lines = [
          '# HELP order_checkout_duration_ms_p50 Rolling client-observed p50 order checkout latency in milliseconds.',
          '# TYPE order_checkout_duration_ms_p50 gauge',
          'order_checkout_duration_ms_p50{service="' + SERVICE_NAME + '",run_id="' + RUN_ID + '"} ' + computeQuantile(sorted, 50),
          '# HELP order_checkout_duration_ms_p95 Rolling client-observed p95 order checkout latency in milliseconds.',
          '# TYPE order_checkout_duration_ms_p95 gauge',
          'order_checkout_duration_ms_p95{service="' + SERVICE_NAME + '",run_id="' + RUN_ID + '"} ' + computeQuantile(sorted, 95),
          '# HELP order_checkout_duration_ms_p99 Rolling client-observed p99 order checkout latency in milliseconds.',
          '# TYPE order_checkout_duration_ms_p99 gauge',
          'order_checkout_duration_ms_p99{service="' + SERVICE_NAME + '",run_id="' + RUN_ID + '"} ' + computeQuantile(sorted, 99),
          '# HELP order_checkout_requests_total Total synthetic order checkout requests issued.',
          '# TYPE order_checkout_requests_total counter',
          'order_checkout_requests_total{service="' + SERVICE_NAME + '",run_id="' + RUN_ID + '"} ' + totalRequests,
          '# HELP order_checkout_errors_total Total synthetic order checkout requests that failed or errored.',
          '# TYPE order_checkout_errors_total counter',
          'order_checkout_errors_total{service="' + SERVICE_NAME + '",run_id="' + RUN_ID + '"} ' + totalErrors,
          '',
        ];
        res.writeHead(200, { 'content-type': 'text/plain; version=0.0.4' });
        res.end(lines.join('\n'));
        return;
      }
      if (req.method === 'GET' && req.url === '/status') {
        const sorted = samples.slice().sort(function (a, b) { return a - b; });
        res.writeHead(200, { 'content-type': 'application/json' });
        res.end(JSON.stringify({
          service: SERVICE_NAME, runId: RUN_ID,
          quantilesMs: { p50: computeQuantile(sorted, 50), p95: computeQuantile(sorted, 95), p99: computeQuantile(sorted, 99) },
          totalRequests: totalRequests, totalErrors: totalErrors,
          errorRatePct: totalRequests > 0 ? (totalErrors / totalRequests) * 100 : 0,
        }, null, 2));
        return;
      }
      res.writeHead(404, { 'content-type': 'application/json' });
      res.end(JSON.stringify({ status: 'not_found' }));
    });

    server.listen(PORT, '0.0.0.0', function () {
      console.log(JSON.stringify({ event: 'startup', service: SERVICE_NAME, port: PORT, dependencyUrl: DEPENDENCY_URL, runId: RUN_ID }));
    });

