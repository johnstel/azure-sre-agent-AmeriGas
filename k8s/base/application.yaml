  template:
    metadata:
      labels:
        app: order-worker
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: order-worker
          image: ghcr.io/azure-samples/aks-store-demo/virtual-worker:latest
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: MAKELINE_SERVICE_URL
              value: "http://order-service:3001"
            - name: ORDERS_PER_HOUR
              value: "100"
            - name: OTEL_SERVICE_NAME
              value: "order-worker"
          envFrom:
            - configMapRef:
                name: propane-telemetry-config